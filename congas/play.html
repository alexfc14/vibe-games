<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congas - Juego de Circuitos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #070a12;
            color: #f8fafc;
            user-select: none;
            overflow-x: hidden;
        }

        .title-font {
            font-family: 'Outfit', sans-serif;
        }

        /* Square Board Cell */
        .grid-cell {
            position: relative;
            aspect-ratio: 1 / 1;
            transition: all 0.2s ease;
            box-sizing: border-box;
            border-radius: 0;
            overflow: visible;
        }

        /* Cell Background Tints */
        .cell-R-bg { background-color: rgba(239, 68, 68, 0.08); }
        .cell-Y-bg { background-color: rgba(234, 179, 8, 0.08); }
        .cell-O-bg { background-color: rgba(249, 115, 22, 0.08); }
        .cell-B-bg { background-color: rgba(59, 130, 246, 0.08); }
        .cell-G-bg { background-color: rgba(34, 197, 94, 0.08); }
        .cell-P-bg { background-color: rgba(168, 85, 247, 0.08); }

        /* Shared / Intersection cells */
        .cell-rg-bg { background-color: rgba(234, 179, 8, 0.12); }
        .cell-go-bg { background-color: rgba(132, 204, 22, 0.12); }
        .cell-rb-bg { background-color: rgba(168, 85, 247, 0.12); }
        .cell-bo-bg { background-color: rgba(14, 165, 233, 0.12); }
        .cell-yb-bg { background-color: rgba(20, 184, 166, 0.12); }
        .cell-gb-bg { background-color: rgba(16, 185, 129, 0.12); }
        .cell-pb-bg { background-color: rgba(217, 70, 239, 0.12); }
        .cell-empty-bg { background-color: transparent; }

        /* Square Piece - Centered & Smaller than cell */
        .square-piece {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            margin: auto;
            width: 72%;
            height: 72%;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.75), inset 0 1px 2px rgba(255, 255, 255, 0.4);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10;
            will-change: transform;
            backface-visibility: hidden;
        }

        .piece-Green {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: 2px solid #bbf7d0;
        }

        .piece-Red {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border: 2px solid #fca5a5;
        }

        .piece-Orange {
            background: linear-gradient(135deg, #f97316, #ea580c);
            border: 2px solid #fed7aa;
        }

        .piece-Yellow {
            background: linear-gradient(135deg, #facc15, #eab308);
            border: 2px solid #fef08a;
        }

        .piece-Blue {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: 2px solid #bfdbfe;
        }

        .piece-Purple {
            background: linear-gradient(135deg, #a855f7, #9333ea);
            border: 2px solid #e9d5ff;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 bg-slate-950 text-slate-100">

    <!-- Top Header Bar -->
    <header class="w-full max-w-5xl flex flex-col sm:flex-row items-center justify-between gap-4 mb-3">
        <div>
            <h1 class="text-3xl sm:text-4xl font-black title-font bg-clip-text text-transparent bg-gradient-to-r from-red-500 via-amber-400 to-purple-400 tracking-wide text-center sm:text-left">
                Congas
            </h1>
            <p class="text-xs sm:text-sm text-slate-400 mt-0.5 text-center sm:text-left">
                Rota las congas de colores para devolver cada ficha a su circuito.
            </p>
        </div>

        <div class="flex items-center gap-3">
            <!-- Level Tabs -->
            <div id="level-tabs" class="bg-slate-900/90 border border-slate-800 p-1 rounded-2xl flex flex-wrap items-center justify-center text-xs font-semibold max-w-[24rem]"></div>

            <!-- Move Counter -->
            <div class="flex items-center gap-2 bg-slate-900/90 border border-slate-800 px-4 py-2 rounded-2xl shadow-lg">
                <div class="text-center">
                    <span class="text-[10px] text-slate-400 block uppercase font-extrabold tracking-wider">MOVIMIENTOS</span>
                    <span id="move-counter" class="text-lg font-black text-amber-400 title-font">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content: Side Panel + Board -->
    <main class="w-full max-w-5xl my-auto flex flex-row items-center justify-center gap-5 sm:gap-8">
        
        <!-- Left Side Control Panel -->
        <div class="shrink-0 flex flex-col gap-3 justify-center items-center">
            
            <!-- Capsule Container for Loop Controls -->
            <div id="controls-capsule" class="bg-slate-900/90 border border-slate-800/80 p-3.5 sm:p-4 rounded-[2.2rem] shadow-xl flex flex-col gap-3.5 items-center">
                <!-- Dynamically generated loop buttons -->
            </div>

            <!-- Utility Icon Buttons Below Capsule -->
            <div class="flex flex-col gap-2 w-full">
                <button onclick="scrambleBoardAnimated()" title="Mezclar fichas" class="w-full bg-purple-900/30 hover:bg-purple-800/40 text-purple-200 border border-purple-500/30 font-semibold py-2.5 px-3 rounded-xl active:scale-95 flex items-center justify-center transition-all text-sm">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 text-purple-400" aria-hidden="true"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"/><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/></svg>
                </button>
                <button id="btn-undo" onclick="undoMove()" title="Deshacer último movimiento" class="w-full bg-slate-800/80 hover:bg-slate-700/80 text-slate-300 border border-slate-700 font-semibold py-2.5 px-3 rounded-xl active:scale-95 flex items-center justify-center transition-all text-sm disabled:opacity-40 disabled:cursor-not-allowed">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 text-slate-300" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
                </button>
            </div>

        </div>

        <!-- Right Side: The Grid Board -->
        <div class="flex-1 min-w-0 max-w-[560px] flex justify-center">
            <div id="board-card" class="bg-slate-900/90 p-4 sm:p-5 rounded-[2rem] border border-slate-800 shadow-2xl relative w-full">
                
                <!-- Win Overlay -->
                <div id="win-overlay" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-md rounded-[2rem] z-30 flex flex-col items-center justify-center p-6 text-center">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-16 h-16 text-amber-400 mb-4 animate-bounce" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
                    <h2 class="text-3xl font-black text-white title-font mb-2">¡Completado!</h2>
                    <p class="text-xs sm:text-sm text-slate-300 max-w-xs mb-6">Todas las congas han vuelto a su circuito correspondiente.</p>
                    <button id="btn-next-level" onclick="nextLevel()" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold py-3 px-8 rounded-xl shadow-xl active:scale-95 transition-all text-sm">
                        Siguiente nivel <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 ml-1.5 inline-block align-[-2px]" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                    </button>
                    <button id="btn-replay" onclick="scrambleBoardAnimated()" class="mt-3 text-slate-400 hover:text-white font-semibold py-1.5 px-4 text-xs transition-all">
                        Jugar de nuevo
                    </button>
                </div>

                <!-- Grid Container -->
                <div id="board-grid" class="grid gap-0 w-full relative rounded-2xl overflow-hidden border border-slate-800/80">
                    <!-- Dynamic Grid Generated by JS -->
                </div>

            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-[11px] text-slate-500 text-center mt-2">
        Congas &bull; Juegos de Circuitos Continuos
    </footer>

    <script>
        // Inline SVG icons (no external icon font needed)
        const SVG_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6" aria-hidden="true">';
        const ICON_ROTATE_CCW = SVG_OPEN + '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>';
        const ICON_ROTATE_CW = SVG_OPEN + '<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>';

        // Track Color Palette
        const TRACK_COLORS = {
            'G': '#22c55e',
            'R': '#ef4444',
            'O': '#f97316',
            'B': '#3b82f6',
            'Y': '#eab308',
            'P': '#a855f7'
        };

        // LEVEL CONFIGURATIONS
        const LEVELS = [
            // LEVEL 0: Cruz - Rotated 90° CCW (Counter-Clockwise)
            // (x, y) -> (y, 3 - x)
            // Loops move in Counter-Clockwise (↺) direction
            {
                id: 0,
                name: 'Cruz',
                cols: 4,
                rows: 4,
                scrambleMoves: 16,
                cellTypes: [
                    ['.',   'R',   'R',   '.'],
                    ['G',   'rg',  'rb',  'B'],
                    ['G',   'go',  'bo',  'B'],
                    ['.',   'O',   'O',   '.']
                ],
                loops: [
                    { 
                        key: 'GREEN', 
                        color: 'G', 
                        pieceColor: 'Green', 
                        name: 'Verde (Izquierda)', 
                        dirSymbol: '↺', 
                        defaultDir: 1, 
                        // CCW path: (0, 2) -> (1, 2) -> (1, 1) -> (0, 1)
                        path: [[0, 2], [1, 2], [1, 1], [0, 1]] 
                    },
                    { 
                        key: 'RED', 
                        color: 'R', 
                        pieceColor: 'Red', 
                        name: 'Roja (Arriba)', 
                        dirSymbol: '↺', 
                        defaultDir: 1, 
                        // CCW path: (1, 1) -> (2, 1) -> (2, 0) -> (1, 0)
                        path: [[1, 1], [2, 1], [2, 0], [1, 0]] 
                    },
                    { 
                        key: 'BLUE', 
                        color: 'B', 
                        pieceColor: 'Blue', 
                        name: 'Azul (Derecha)', 
                        dirSymbol: '↺', 
                        defaultDir: 1, 
                        // Strictly CCW path: (2, 1) -> (2, 2) -> (3, 2) -> (3, 1)
                        path: [[2, 1], [2, 2], [3, 2], [3, 1]] 
                    },
                    { 
                        key: 'ORANGE', 
                        color: 'O', 
                        pieceColor: 'Orange', 
                        name: 'Naranja (Abajo)', 
                        dirSymbol: '↺', 
                        defaultDir: 1, 
                        // Strictly CCW path: (1, 2) -> (1, 3) -> (2, 3) -> (2, 2)
                        path: [[1, 2], [1, 3], [2, 3], [2, 2]] 
                    }
                ],
                initialPieces: {
                    Green: [[0, 1], [0, 2]],
                    Red: [[1, 0], [2, 0]],
                    Blue: [[3, 1], [3, 2]],
                    Orange: [[1, 3], [2, 3]],
                    // Each loop initially owns its base intersection
                    GreenShared: [[1, 1]],
                    RedShared: [[2, 1]],
                    BlueShared: [[2, 2]],
                    OrangeShared: [[1, 2]]
                }
            },
            // LEVEL 1: 4x4 (Micro)
            {
                id: 1,
                name: '4x4',
                cols: 4,
                rows: 4,
                scrambleMoves: 30,
                cellTypes: [
                    ['R',  'R',   'G',   'G'],
                    ['R',  'rb',  'gb',  'G'],
                    ['Y',  'yb',  'pb',  'P'],
                    ['Y',  'Y',   'P',   'P']
                ],
                loops: [
                    { key: 'RED', color: 'R', pieceColor: 'Red', name: 'Roja', dirSymbol: '↺', defaultDir: 1, path: [[0,0], [0,1], [1,1], [1,0]] },
                    { key: 'GREEN', color: 'G', pieceColor: 'Green', name: 'Verde', dirSymbol: '↺', defaultDir: 1, path: [[2,0], [2,1], [3,1], [3,0]] },
                    { key: 'BLUE', color: 'B', pieceColor: 'Blue', name: 'Azul', dirSymbol: '↺', defaultDir: 1, path: [[1,1], [1,2], [2,2], [2,1]] },
                    { key: 'YELLOW', color: 'Y', pieceColor: 'Yellow', name: 'Amarilla', dirSymbol: '↺', defaultDir: 1, path: [[0,2], [0,3], [1,3], [1,2]] },
                    { key: 'PURPLE', color: 'P', pieceColor: 'Purple', name: 'Púrpura', dirSymbol: '↺', defaultDir: 1, path: [[2,2], [2,3], [3,3], [3,2]] }
                ],
                initialPieces: {
                    Red: [[0,0], [1,0], [0,1]],
                    Green: [[2,0], [3,0], [3,1]],
                    Yellow: [[0,2], [0,3], [1,3]],
                    Purple: [[2,3], [3,3], [3,2]],
                    Blue: [[1,1], [2,1], [2,2], [1,2]]
                }
            },
            // LEVEL 2: 6x5 (Clásico)
            {
                id: 2,
                name: '6x5',
                cols: 6,
                rows: 5,
                scrambleMoves: 45,
                cellTypes: [
                    ['R',  'R',  'R',  'Y',  'Y',  'Y'],
                    ['R',  'B',  'rb', 'yb', 'B',  'Y'],
                    ['R',  'B',  'R',  'Y',  'B',  'Y'],
                    ['R',  'B',  'rb', 'yb', 'B',  'Y'],
                    ['R',  'R',  'R',  'Y',  'Y',  'Y']
                ],
                loops: [
                    { key: 'RED', color: 'R', pieceColor: 'Red', name: 'Roja', dirSymbol: '↺', defaultDir: 1, path: [[0, 0], [0, 1], [0, 2], [0, 3], [0, 4], [1, 4], [2, 4], [2, 3], [2, 2], [2, 1], [2, 0], [1, 0]] },
                    { key: 'BLUE', color: 'B', pieceColor: 'Blue', name: 'Azul', dirSymbol: '↺', defaultDir: 1, path: [[1, 1], [1, 2], [1, 3], [2, 3], [3, 3], [4, 3], [4, 2], [4, 1], [3, 1], [2, 1]] },
                    { key: 'YELLOW', color: 'Y', pieceColor: 'Yellow', name: 'Amarilla', dirSymbol: '↻', defaultDir: 1, path: [[3, 0], [4, 0], [5, 0], [5, 1], [5, 2], [5, 3], [5, 4], [4, 4], [3, 4], [3, 3], [3, 2], [3, 1]] }
                ],
                initialPieces: {
                    Red: [[0,0],[0,1],[0,2],[0,3],[0,4],[1,4],[2,4],[2,3],[2,2],[2,1],[2,0],[1,0]],
                    Yellow: [[3,0],[4,0],[5,0],[5,1],[5,2],[5,3],[5,4],[4,4],[3,4],[3,3],[3,2],[3,1]],
                    Blue: [[1,1],[1,2],[1,3],[4,1],[4,2],[4,3]]
                }
            },
            // LEVEL 3: 6x6 (Gran Plaza)
            {
                id: 3,
                name: '6x6',
                cols: 6,
                rows: 6,
                scrambleMoves: 65,
                cellTypes: [
                    ['R', 'R',  'R',  'Y',  'Y',  'Y'],
                    ['R', 'B',  'rb', 'yb', 'B',  'Y'],
                    ['R', 'R',  'R',  'Y',  'yb', 'Y'],
                    ['G', 'gb', 'G',  'P',  'pb', 'P'],
                    ['G', 'B',  'gb', 'pb', 'B',  'P'],
                    ['G', 'G',  'G',  'P',  'P',  'P']
                ],
                loops: [
                    { key: 'RED', color: 'R', pieceColor: 'Red', name: 'Roja', dirSymbol: '↺', defaultDir: 1, path: [[0,0],[0,1],[0,2],[1,2],[2,2],[2,1],[2,0],[1,0]] },
                    { key: 'YELLOW', color: 'Y', pieceColor: 'Yellow', name: 'Amarilla', dirSymbol: '↺', defaultDir: 1, path: [[3,0],[4,0],[5,0],[5,1],[5,2],[4,2],[3,2],[3,1]] },
                    { key: 'BLUE', color: 'B', pieceColor: 'Blue', name: 'Azul', dirSymbol: '↺', defaultDir: 1, path: [[1,1],[1,2],[1,3],[1,4],[2,4],[3,4],[4,4],[4,3],[4,2],[4,1],[3,1],[2,1]] },
                    { key: 'GREEN', color: 'G', pieceColor: 'Green', name: 'Verde', dirSymbol: '↺', defaultDir: 1, path: [[0,3],[0,4],[0,5],[1,5],[2,5],[2,4],[2,3],[1,3]] },
                    { key: 'PURPLE', color: 'P', pieceColor: 'Purple', name: 'Púrpura', dirSymbol: '↺', defaultDir: 1, path: [[3,3],[3,4],[3,5],[4,5],[5,5],[5,4],[5,3],[4,3]] }
                ],
                initialPieces: {
                    Red: [[0,0],[0,1],[0,2],[1,2],[2,2],[2,1],[2,0],[1,0]],
                    Yellow: [[3,0],[4,0],[5,0],[5,1],[5,2],[4,2],[3,2],[3,1]],
                    Green: [[0,3],[0,4],[0,5],[1,5],[2,5],[2,4],[2,3],[1,3]],
                    Purple: [[3,3],[3,4],[3,5],[4,5],[5,5],[5,4],[5,3],[4,3]],
                    Blue: [[1,1],[1,4],[4,4],[4,1]]
                }
            }
        ];

        // ===== NEW LEVELS (strict goal grids: each cell has exactly one target colour) =====
        const COLOR_META = {
            R: ['RED', 'Red', 'Roja'], G: ['GREEN', 'Green', 'Verde'], B: ['BLUE', 'Blue', 'Azul'],
            Y: ['YELLOW', 'Yellow', 'Amarilla'], P: ['PURPLE', 'Purple', 'Púrpura'], O: ['ORANGE', 'Orange', 'Naranja']
        };

        // Closed rectangular ring (perimeter of a w×h block at x,y). Default = counter-clockwise ↺.
        function ring(x, y, w, h) {
            const p = [];
            for (let i = 0; i < w; i++) p.push([x + i, y + h - 1]);
            for (let j = h - 2; j >= 0; j--) p.push([x + w - 1, y + j]);
            for (let i = w - 2; i >= 0; i--) p.push([x + i, y]);
            for (let j = 1; j < h - 1; j++) p.push([x, y + j]);
            return p;
        }


        // Closed loop along the outline of any rectilinear polygon (vertices at cell centres).
        // Lets loops be L-shaped, hook-shaped, etc. Normalised to counter-clockwise ↺.
        function poly(pts) {
            const p = [], n = pts.length;
            for (let i = 0; i < n; i++) {
                const [x0, y0] = pts[i], [x1, y1] = pts[(i + 1) % n];
                const dx = Math.sign(x1 - x0), dy = Math.sign(y1 - y0);
                const steps = Math.abs(x1 - x0) + Math.abs(y1 - y0);
                for (let k = 0; k < steps; k++) p.push([x0 + dx * k, y0 + dy * k]);
            }
            let area = 0;
            p.forEach(([x, y], i) => { const [x2, y2] = p[(i + 1) % p.length]; area += x * y2 - x2 * y; });
            return area > 0 ? p.reverse() : p;
        }

        function mkLoop(c, path, cw = false) {
            const [key, pieceColor, name] = COLOR_META[c];
            return { key, color: c, pieceColor, name, dirSymbol: cw ? '↻' : '↺', defaultDir: 1,
                     path: cw ? path.slice().reverse() : path };
        }

        function strictLevel(name, goal, loops, scrambleMoves) {
            const initialPieces = {};
            goal.forEach((row, y) => [...row].forEach((ch, x) => {
                if (ch === '.') return;
                const n = COLOR_META[ch][1];
                (initialPieces[n] = initialPieces[n] || []).push([x, y]);
            }));
            return { id: LEVELS.length, name, cols: goal[0].length, rows: goal.length, scrambleMoves,
                     strict: true, cellTypes: goal.map(r => [...r]), loops, initialPieces };
        }

        LEVELS.push(
            // Easy ─────────────────────────────────────────
            strictLevel('Dúo',
                ['RRB',
                 'RBB'],
                [mkLoop('R', ring(0, 0, 2, 2)), mkLoop('B', ring(1, 0, 2, 2))], 14),

            strictLevel('Cadena',
                ['RBBY',
                 'RBBY'],
                [mkLoop('R', ring(0, 0, 2, 2)), mkLoop('B', ring(1, 0, 2, 2)), mkLoop('Y', ring(2, 0, 2, 2))], 24),

            // Medium ───────────────────────────────────────
            // Asymmetric ───────────────────────────────────
            strictLevel('Ancla',
                ['RRRR',
                 'RRRR',
                 'YYBB',
                 'YYBB'],
                [mkLoop('R', ring(0, 0, 4, 2)), mkLoop('B', ring(2, 1, 2, 3)), mkLoop('Y', ring(0, 2, 3, 2))], 32),

            strictLevel('Bota',
                ['RRYYY',
                 'RRYBB',
                 'RBBBB',
                 'RBBBB'],
                [mkLoop('R', poly([[0, 0], [2, 0], [2, 1], [1, 1], [1, 3], [0, 3]])),
                 mkLoop('B', poly([[1, 2], [3, 2], [3, 1], [4, 1], [4, 3], [1, 3]])),
                 mkLoop('Y', ring(2, 0, 3, 2))], 40),

            // Interlocked rectangles (from sketch): tall bar × square ring × wide bar, corners empty
            strictLevel('Telar',
                ['..PP..',
                 '.OOOO.',
                 'GGPPGG',
                 'GGPPGG',
                 '.OOOO.',
                 '..PP..'],
                [mkLoop('P', ring(2, 0, 2, 6)), mkLoop('O', ring(1, 1, 4, 4)), mkLoop('G', ring(0, 2, 6, 2))], 60),

            // Hard ─────────────────────────────────────────
            strictLevel('Cuadrantes',
                ['RRGG',
                 'RRGG',
                 'YYBB',
                 'YYBB'],
                [mkLoop('R', ring(0, 0, 3, 3)), mkLoop('G', ring(1, 0, 3, 3)),
                 mkLoop('Y', ring(0, 1, 3, 3)), mkLoop('B', ring(1, 1, 3, 3))], 60),

            strictLevel('Rosetón',
                ['RRGGG',
                 'ROGOG',
                 'RROBB',
                 'YOYOB',
                 'YYYBB'],
                [mkLoop('R', ring(0, 0, 3, 3)), mkLoop('G', ring(2, 0, 3, 3)),
                 mkLoop('B', ring(2, 2, 3, 3)), mkLoop('Y', ring(0, 2, 3, 3)),
                 mkLoop('O', ring(1, 1, 3, 3))], 90)
        );

        // Rename numeric levels and sort everything by difficulty
        const RENAMES = { '4x4': 'Flor', '6x5': 'Clásico', '6x6': 'Gran Plaza' };
        LEVELS.forEach(l => { if (RENAMES[l.name]) l.name = RENAMES[l.name]; });
        const DIFFICULTY_ORDER = ['Dúo', 'Cadena', 'Cruz', 'Ancla', 'Bota', 'Flor', 'Clásico', 'Telar', 'Gran Plaza', 'Cuadrantes', 'Rosetón'];
        LEVELS.sort((a, b) => DIFFICULTY_ORDER.indexOf(a.name) - DIFFICULTY_ORDER.indexOf(b.name));
        LEVELS.forEach((l, i) => { l.id = i; });
        // ===== END NEW LEVELS =====

        // Active Game State
        let currentLevelIdx = 0;
        let boardState = [];
        let moveCount = 0;
        let isAnimating = false;
        let isScrambling = false;
        let historyStack = [];

        function getActiveLevel() {
            return LEVELS[currentLevelIdx];
        }

        function createMovementTracksSVG(r, c) {
            const level = getActiveLevel();
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', '0 0 100 100');
            svg.className = 'absolute inset-0 w-full h-full pointer-events-none z-0';

            const OFFSETS = [32, 50, 68];

            level.loops.forEach(loop => {
                const path = loop.path;
                const n = path.length;

                const idx = path.findIndex(([x, y]) => x === c && y === r);
                if (idx === -1) return;

                const [currX, currY] = path[idx];
                const [prevX, prevY] = path[(idx - 1 + n) % n];
                const [nextX, nextY] = path[(idx + 1) % n];

                function getSide(otherX, otherY) {
                    if (otherX < currX) return 'LEFT';
                    if (otherX > currX) return 'RIGHT';
                    if (otherY < currY) return 'TOP';
                    if (otherY > currY) return 'BOTTOM';
                    return null;
                }

                const sides = [
                    getSide(prevX, prevY),
                    getSide(nextX, nextY)
                ];

                const colorHex = TRACK_COLORS[loop.color] || '#64748b';
                const isHoriz = sides.includes('LEFT') && sides.includes('RIGHT');
                const isVert = sides.includes('TOP') && sides.includes('BOTTOM');

                OFFSETS.forEach(o => {
                    const svgPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    svgPath.setAttribute('stroke', colorHex);
                    svgPath.setAttribute('stroke-width', '3.8');
                    svgPath.setAttribute('fill', 'none');
                    svgPath.setAttribute('opacity', '0.85');
                    svgPath.setAttribute('stroke-linecap', 'round');

                    if (isHoriz) {
                        svgPath.setAttribute('d', `M 0,${o} L 100,${o}`);
                    } else if (isVert) {
                        svgPath.setAttribute('d', `M ${o},0 L ${o},100`);
                    } else {
                        const hSide = sides.find(s => s === 'LEFT' || s === 'RIGHT');
                        const vSide = sides.find(s => s === 'TOP' || s === 'BOTTOM');

                        if (hSide && vSide) {
                            const hX = hSide === 'LEFT' ? 0 : 100;
                            const vY = vSide === 'TOP' ? 0 : 100;
                            svgPath.setAttribute('d', `M ${hX},${o} Q ${o},${o} ${o},${vY}`);
                        }
                    }

                    svg.appendChild(svgPath);
                });
            });

            return svg;
        }

        function buildControlsCapsule() {
            const level = getActiveLevel();
            const capsuleEl = document.getElementById('controls-capsule');
            capsuleEl.innerHTML = '';

            const btnStyles = {
                'G': 'from-green-500 to-emerald-600 text-white shadow-green-950/80 border-green-300/40',
                'R': 'from-red-500 to-red-600 text-white shadow-red-950/80 border-red-300/40',
                'O': 'from-orange-500 to-amber-600 text-white shadow-orange-950/80 border-orange-300/40',
                'B': 'from-blue-500 to-blue-600 text-white shadow-blue-950/80 border-blue-300/40',
                'Y': 'from-amber-400 to-yellow-500 text-slate-950 shadow-amber-950/80 border-yellow-200/50',
                'P': 'from-purple-500 to-purple-600 text-white shadow-purple-950/80 border-purple-300/40'
            };

            level.loops.forEach(loop => {
                const btn = document.createElement('button');
                btn.id = `btn-${loop.key.toLowerCase()}`;
                btn.onclick = () => rotateLoop(loop.key);
                btn.title = `Conga ${loop.name} (${loop.dirSymbol})`;
                btn.className = `w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-gradient-to-br ${btnStyles[loop.color]} shadow-lg hover:scale-105 active:scale-95 transition-all duration-150 flex items-center justify-center border-2 text-xl sm:text-2xl`;
                
                btn.innerHTML = loop.dirSymbol === '↻' ? ICON_ROTATE_CW : ICON_ROTATE_CCW;

                capsuleEl.appendChild(btn);
            });
        }

        // Keep the board inside the viewport: cap its width so that its height fits on screen
        function fitBoard() {
            const level = getActiveLevel();
            const card = document.getElementById('board-card');
            if (!card || !level) return;
            const availH = Math.max(220, window.innerHeight - 250);
            const gridW = Math.min(520, availH * level.cols / level.rows);
            card.style.maxWidth = Math.round(gridW + 44) + 'px';
        }
        window.addEventListener('resize', fitBoard);

        function createGridDOM() {
            const level = getActiveLevel();
            const gridEl = document.getElementById('board-grid');
            
            gridEl.className = `grid grid-cols-${level.cols} gap-0 w-full relative rounded-2xl overflow-hidden border border-slate-800/80`;
            gridEl.innerHTML = '';
            fitBoard();

            for (let r = 0; r < level.rows; r++) {
                for (let c = 0; c < level.cols; c++) {
                    const type = level.cellTypes[r][c];
                    const cellEl = document.createElement('div');

                    if (type === '.') {
                        cellEl.className = 'grid-cell flex items-center justify-center cell-empty-bg opacity-15 pointer-events-none';
                    } else {
                        cellEl.className = `grid-cell flex items-center justify-center cell-${type}-bg`;
                    }
                    cellEl.id = `cell-${c}-${r}`;

                    if (type !== '.') {
                        const tracksSVG = createMovementTracksSVG(r, c);
                        cellEl.appendChild(tracksSVG);
                    }

                    gridEl.appendChild(cellEl);
                }
            }
        }

        function initBoard() {
            const level = getActiveLevel();
            boardState = Array(level.rows).fill(null).map(() => Array(level.cols).fill(null));
            historyStack = [];

            let pieceCounter = 1;
            Object.entries(level.initialPieces).forEach(([colorKey, coords]) => {
                const cleanColor = colorKey.replace('Shared', '');
                coords.forEach(([x, y]) => {
                    boardState[y][x] = { id: `${cleanColor[0]}${pieceCounter++}`, color: cleanColor };
                });
            });

            moveCount = 0;
            updateMoveCounter();
            updateUndoButtonState();
            renderBoard();
        }

        function renderBoard() {
            createGridDOM();
            const level = getActiveLevel();

            for (let r = 0; r < level.rows; r++) {
                for (let c = 0; c < level.cols; c++) {
                    const piece = boardState[r][c];
                    const cellEl = getCellElement(c, r);

                    const existingPiece = cellEl.querySelector('.square-piece');
                    if (existingPiece) cellEl.removeChild(existingPiece);

                    if (piece) {
                        const pieceEl = document.createElement('div');
                        pieceEl.className = `square-piece piece-${piece.color}`;
                        pieceEl.id = `piece-${piece.id}`;
                        cellEl.appendChild(pieceEl);
                    }
                }
            }
        }

        function getCellElement(x, y) {
            return document.getElementById(`cell-${x}-${y}`);
        }

        async function rotateLoop(loopKey, overrideDir = null, duration = 220, isUndo = false) {
            if (isAnimating) return;
            isAnimating = true;

            const level = getActiveLevel();
            const loopConfig = level.loops.find(l => l.key === loopKey);
            if (!loopConfig) {
                isAnimating = false;
                return;
            }

            let path = loopConfig.path;
            let dir = loopConfig.defaultDir;

            if (overrideDir !== null) dir = overrideDir;
            const n = path.length;

            const movePairs = [];
            for (let i = 0; i < n; i++) {
                const [srcX, srcY] = path[i];
                let targetIdx = (i + dir) % n;
                if (targetIdx < 0) targetIdx += n;
                const [tgtX, tgtY] = path[targetIdx];

                const srcCell = getCellElement(srcX, srcY);
                const tgtCell = getCellElement(tgtX, tgtY);
                const pieceEl = srcCell ? srcCell.querySelector('.square-piece') : null;

                if (pieceEl && srcCell && tgtCell) {
                    const srcRect = srcCell.getBoundingClientRect();
                    const tgtRect = tgtCell.getBoundingClientRect();

                    const deltaX = tgtRect.left - srcRect.left;
                    const deltaY = tgtRect.top - srcRect.top;

                    movePairs.push({ pieceEl, tgtCell, deltaX, deltaY });
                }
            }

            movePairs.forEach(({ pieceEl, deltaX, deltaY }) => {
                pieceEl.style.transition = `transform ${duration}ms cubic-bezier(0.25, 1, 0.5, 1)`;
                pieceEl.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
                pieceEl.style.zIndex = '30';
            });

            await new Promise(resolve => setTimeout(resolve, duration));

            movePairs.forEach(({ pieceEl, tgtCell }) => {
                pieceEl.style.transition = 'none';
                pieceEl.style.transform = 'none';
                pieceEl.style.zIndex = '10';
                tgtCell.appendChild(pieceEl);
            });

            const currentPieces = path.map(([x, y]) => boardState[y][x]);
            const shiftedPieces = new Array(n);

            for (let i = 0; i < n; i++) {
                let targetIdx = (i + dir) % n;
                if (targetIdx < 0) targetIdx += n;
                shiftedPieces[targetIdx] = currentPieces[i];
            }

            path.forEach(([x, y], idx) => {
                boardState[y][x] = shiftedPieces[idx];
            });

            if (!isScrambling && !isUndo) {
                historyStack.push({ loopKey, dir });
                moveCount++;
            } else if (isUndo) {
                moveCount = Math.max(0, moveCount - 1);
            }

            isAnimating = false;

            updateMoveCounter();
            updateUndoButtonState();
            checkWinState();
        }

        function buildTabs() {
            const el = document.getElementById('level-tabs');
            el.innerHTML = '';
            LEVELS.forEach((lv, idx) => {
                const b = document.createElement('button');
                b.id = `tab-lvl-${idx}`;
                b.textContent = lv.name;
                b.onclick = () => switchLevel(idx);
                b.className = 'px-3 py-1.5 rounded-xl transition-all text-slate-400 hover:text-white';
                el.appendChild(b);
            });
        }

        function nextLevel() {
            if (currentLevelIdx < LEVELS.length - 1) switchLevel(currentLevelIdx + 1);
        }

        function switchLevel(lvlIdx) {
            if (isAnimating || isScrambling) return;
            currentLevelIdx = lvlIdx;

            // Highlight Active Tab
            LEVELS.forEach((_, idx) => {
                const tab = document.getElementById(`tab-lvl-${idx}`);
                if (tab) {
                    if (idx === lvlIdx) {
                        tab.className = "px-3 py-1.5 rounded-xl transition-all bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-md font-bold";
                    } else {
                        tab.className = "px-3 py-1.5 rounded-xl transition-all text-slate-400 hover:text-white";
                    }
                }
            });

            buildControlsCapsule();
            scrambleBoardAnimated();
        }

        async function scrambleBoardAnimated() {
            if (isAnimating || isScrambling) return;
            isScrambling = true;
            document.getElementById('win-overlay').classList.add('hidden');
            
            initBoard();
            await new Promise(r => setTimeout(r, 150));

            const level = getActiveLevel();
            const loopKeys = level.loops.map(l => l.key);

            for (let i = 0; i < level.scrambleMoves; i++) {
                const randLoopKey = loopKeys[Math.floor(Math.random() * loopKeys.length)];
                const randDir = Math.random() < 0.5 ? 1 : -1;
                await rotateLoop(randLoopKey, randDir, 45);
            }

            moveCount = 0;
            historyStack = [];
            isScrambling = false;
            
            updateMoveCounter();
            updateUndoButtonState();
            checkWinState();
        }

        async function undoMove() {
            if (isAnimating || isScrambling || historyStack.length === 0) return;
            const lastMove = historyStack.pop();
            const reverseDir = -lastMove.dir;
            await rotateLoop(lastMove.loopKey, reverseDir, 200, true);
        }

        function updateUndoButtonState() {
            const undoBtn = document.getElementById('btn-undo');
            if (undoBtn) {
                undoBtn.disabled = historyStack.length === 0 || isScrambling || isAnimating;
            }
        }

        function updateMoveCounter() {
            document.getElementById('move-counter').innerText = moveCount;
        }

        // Colours of every loop passing through each cell, e.g. {"2,1": Set(Purple, Orange)}
        function getCellLoopColors(level) {
            if (level._cellLoopColors) return level._cellLoopColors;
            const map = {};
            level.loops.forEach(lp => lp.path.forEach(([x, y]) => {
                (map[`${x},${y}`] = map[`${x},${y}`] || new Set()).add(lp.pieceColor);
            }));
            level._cellLoopColors = map;
            return map;
        }

        function checkWinState() {
            if (isScrambling) return;

            const level = getActiveLevel();
            let isWin = true;

            for (let r = 0; r < level.rows; r++) {
                for (let c = 0; c < level.cols; c++) {
                    const cellType = level.cellTypes[r][c];
                    const piece = boardState[r][c];

                    if (!piece) continue;

                    const validColorsMap = {
                        'Green': ['G', 'rg', 'go', 'gb'],
                        'Red': ['R', 'rg', 'rb'],
                        'Orange': ['O', 'go', 'bo'],
                        'Blue': ['B', 'rb', 'bo', 'gb', 'pb', 'yb'],
                        'Yellow': ['Y', 'yb'],
                        'Purple': ['P', 'pb']
                    };

                    // A piece is valid on any cell crossed by a loop of its own colour
                    // (where two loops cross, either colour is accepted).
                    const crossing = getCellLoopColors(level)[`${c},${r}`];
                    let valid = !!(crossing && crossing.has(piece.color));
                    // The designed solution always counts (e.g. the hollow centre of a ring has no track of its own colour)
                    if (!valid && level.strict) valid = (cellType === piece.color[0]);
                    // Older levels also keep their hand-written cell types
                    if (!valid && !level.strict) valid = (validColorsMap[piece.color] || []).includes(cellType);
                    if (!valid) {
                        isWin = false;
                        break;
                    }
                }
                if (!isWin) break;
            }

            if (isWin && moveCount > 0 && historyStack.length > 0) {
                const isLast = currentLevelIdx >= LEVELS.length - 1;
                const nextBtn = document.getElementById('btn-next-level');
                const replayBtn = document.getElementById('btn-replay');
                nextBtn.classList.toggle('hidden', isLast);
                // On the last level, replay becomes the main button
                replayBtn.className = isLast
                    ? 'bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold py-3 px-8 rounded-xl shadow-xl active:scale-95 transition-all text-sm'
                    : 'mt-3 text-slate-400 hover:text-white font-semibold py-1.5 px-4 text-xs transition-all';
                document.getElementById('win-overlay').classList.remove('hidden');
            }
        }

        // Keyboard Shortcut Handler
        window.addEventListener('keydown', (e) => {
            const level = getActiveLevel();
            if (e.key === '1' && level.loops[0]) rotateLoop(level.loops[0].key);
            if (e.key === '2' && level.loops[1]) rotateLoop(level.loops[1].key);
            if (e.key === '3' && level.loops[2]) rotateLoop(level.loops[2].key);
            if (e.key === '4' && level.loops[3]) rotateLoop(level.loops[3].key);
            if (e.key === '5' && level.loops[4]) rotateLoop(level.loops[4].key);

            if ((e.key === 'z' || e.key === 'Z') && (e.ctrlKey || e.metaKey)) undoMove();
            if (e.key === 'u' || e.key === 'U') undoMove();
        });

        // Initialize on load
        window.onload = function() {
            buildTabs();
            switchLevel(0); // Starts on Cruz level
        };
    </script>
</body>
</html>
