<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Topology Carver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: the board fills the screen. Level selector top left, readout top right, brush and undo in a dock at the bottom. */
  :root {
    --ink: #0b1219;
    --glass: rgba(14, 22, 30, 0.84);
    --track: #1b2733;
    --line: #26353f;
    --fg: #dbe6ee;
    --muted: #7f93a3;
    --accent: #f2c14e;
    --good: #5fd0a0;
    --warn: #f0a23c;
    --bad: #ee5d4c;
    --font-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --font-body: 'IBM Plex Sans', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--ink); color: var(--fg); font-family: var(--font-body); font-size: 13px; overflow: hidden; -webkit-user-select: none; user-select: none; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #stage { position: absolute; inset: 0; overflow: hidden; }
  #stage canvas { position: absolute; inset: 0; touch-action: none; cursor: crosshair; display: block; }

  .glass { background: var(--glass); border: 1px solid var(--line); border-radius: 10px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .icon { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
  .icon:hover:not(:disabled) { color: var(--fg); background: rgba(255, 255, 255, 0.06); }
  .icon:disabled { opacity: 0.35; cursor: not-allowed; }

  #top { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
  #top > * { pointer-events: auto; }

  /* Level selector */
  #lvl { position: relative; display: flex; align-items: center; padding: 3px; }
  #lvlbtn { display: flex; align-items: baseline; gap: 8px; padding: 4px 6px; border-radius: 8px; min-width: 0; }
  #lvlbtn:hover { background: rgba(255, 255, 255, 0.06); }
  #lvlnum { font-family: var(--font-mono); font-size: 13px; color: var(--accent); }
  #lvlname { font-family: var(--font-display); font-weight: 600; font-size: 20px; letter-spacing: 0.03em; text-transform: uppercase; white-space: nowrap; }
  #menu { position: absolute; top: calc(100% + 8px); left: 0; display: grid; grid-template-columns: repeat(4, 54px); gap: 6px; padding: 8px; }
  .chip { height: 50px; border-radius: 8px; border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-family: var(--font-mono); font-size: 13px; }
  .chip:hover { border-color: var(--muted); }
  .chip[aria-current="true"] { border-color: var(--accent); }
  .pips { display: flex; gap: 3px; }
  .pips i { width: 6px; height: 6px; border-radius: 50%; background: var(--track); display: block; }
  .chip[data-n="1"] .pips i:nth-child(-n+1), .chip[data-n="2"] .pips i:nth-child(-n+2), .chip[data-n="3"] .pips i { background: var(--accent); }

  /* Readout */
  #stats { display: flex; gap: 18px; padding: 8px 14px; }
  .stat { min-width: 0; }
  .k { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .row { display: flex; align-items: baseline; gap: 2px; }
  .v { font-family: var(--font-mono); font-weight: 600; font-size: 24px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .row small { font-size: 12px; color: var(--muted); }
  #statCarved[data-s="settling"] { color: var(--muted); }
  #statCarved[data-s="passed"] { color: var(--good); }
  #statCarved[data-s="failed"] { color: var(--bad); }
  #stars { display: flex; gap: 3px; height: 16px; }
  .star { width: 16px; height: 16px; fill: none; stroke: var(--line); stroke-width: 1.6; stroke-linejoin: round; }
  #stars[data-n="1"] .star:nth-child(-n+1), #stars[data-n="2"] .star:nth-child(-n+2), #stars[data-n="3"] .star { fill: var(--accent); stroke: var(--accent); }
  .bar { position: relative; width: 104px; height: 6px; margin-top: 8px; border-radius: 3px; overflow: hidden; background: linear-gradient(90deg, #2b5f7a, #33908f 30%, #e6c24c 55%, #f08540 80%, #e84a3b); }
  .bar i { position: absolute; top: 0; bottom: 0; right: 0; width: 100%; background: var(--track); }

  /* Dock */
  #dock { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 4px 14px 4px 4px; }
  #undo[data-alert="1"] { color: var(--bad); background: rgba(238, 93, 76, 0.14); }
  .sep { width: 1px; height: 20px; background: var(--line); }
  .dotwrap { width: 28px; height: 28px; display: grid; place-items: center; }
  #brushDot { display: block; border-radius: 50%; border: 1.5px solid var(--accent); background: rgba(242, 193, 78, 0.18); }
  input[type=range] { width: 150px; accent-color: var(--accent); margin: 0; }

  @media (max-width: 560px) {
    #lvlname { display: none; }
    #stats { gap: 12px; padding: 6px 10px; }
    .v { font-size: 19px; }
    .bar { width: 76px; }
    input[type=range] { width: 120px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<main id="stage">
  <div id="top">
    <div id="lvl" class="glass">
      <button type="button" class="icon" id="prev" aria-label="Previous level"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button type="button" id="lvlbtn" aria-haspopup="true" aria-expanded="false" aria-label="Choose level"><span id="lvlnum">1</span><span id="lvlname">Bedrock</span></button>
      <button type="button" class="icon" id="next" aria-label="Next level"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      <div id="menu" class="glass" hidden></div>
    </div>

          <svg class="star" viewBox="0 0 24 24"><path d="M12 2.5l3 6.2 6.8.9-5 4.8 1.3 6.7-6.1-3.3-6.1 3.3 1.3-6.7-5-4.8 6.8-.9z"/></svg>
          <svg class="star" viewBox="0 0 24 24"><path d="M12 2.5l3 6.2 6.8.9-5 4.8 1.3 6.7-6.1-3.3-6.1 3.3 1.3-6.7-5-4.8 6.8-.9z"/></svg>
          <svg class="star" viewBox="0 0 24 24"><path d="M12 2.5l3 6.2 6.8.9-5 4.8 1.3 6.7-6.1-3.3-6.1 3.3 1.3-6.7-5-4.8 6.8-.9z"/></svg>
        </div>
      </div>
      <div class="stat">
        <div class="k">Stress</div>

  <div id="dock" class="glass">
    <button type="button" class="icon" id="undo" aria-label="Undo last stroke" title="Undo (Ctrl+Z)" disabled><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h10a5 5 0 015 5v2M3 10l6-6M3 10l6 6"/></svg></button>
    <span class="sep"></span>
    <span class="dotwrap"><i id="brushDot"></i></span>
    <input type="range" id="radius" min="0.4" max="3.8" step="0.1" value="1.8" aria-label="Brush size">
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

/* ---------- Constants ---------- */
const COLS = 36, ROWS = 22, SP = 1.0;
const HALF_W = (COLS - 1) * SP * 0.5, HALF_H = (ROWS - 1) * SP * 0.5;
const EXT = 4;                       // bedrock cells drawn beyond the board edge
const WORLD_W = 48, WORLD_H = 33;    // world area kept in view

const SUBSTEPS = 6, DT = 0.016 / SUBSTEPS, DAMPING = 1.0;
const K_AXIAL = 340, K_SHEAR = 190;
const MAX_COMPRESSION = 26, MAX_TENSION = 48, MAX_SHEAR = 20;
const NODE_MASS = 0.25, LOAD_MASS = 2.0, GRAVITY = 0.3;
const MAX_DROP = 1.6;
const STARS = [70, 75, 80];   // % removed for 1, 2 and 3 stars
const STABLE_STEPS = 24, PEAK_EPS = 2e-5, SOLVES_PER_FRAME = 14;
const CELL_HALF = 0.47;

const LEVELS = [
  { name: 'Bedrock', loadCols: [16,17,18,19], loadRow: ROWS - 1, force: -68,
    fixed: (c, r) => r === 0 },
  { name: 'River Gorge', loadCols: [16,17,18,19], loadRow: ROWS - 1, force: -72, water: true,
    fixed: (c, r) => r <= 3 && (c <= 7 || c >= 28) },
  { name: 'Cantilever', void: (c, r) => c >= 27, loadCols: [18,19,20,21], loadRow: ROWS - 3, force: -51,
    fixed: (c, r) => c <= 8 },
  { name: 'Valley Island', loadCols: [20,21,22,23], loadRow: ROWS - 1, force: -69, water: true,
    fixed: (c, r) => r <= 3 && (c <= 6 || (c >= 13 && c <= 17) || c >= 29) },
  { name: 'Canopy Tower', loadCols: [21,22,23,24], loadRow: ROWS - 2, force: -31,
    fixed: (c, r) => c >= 12 && c <= 19 && r <= 7 },
  { name: 'Skyline Gantry', loadCols: [16,17,18,19], loadRow: 4, force: -112, water: true,
    fixed: (c, r) => r >= ROWS - 3 && (c <= 8 || c >= 27) },
  { name: 'Hanging Chandelier', loadCols: [16,17,18,19], loadRow: 3, force: -116,
    fixed: (c, r) => r === ROWS - 1 && c >= 9 && c <= 26 },
  { name: 'Gorge Cradle', loadCols: [16,17,18,19], loadRow: 6, force: -118, water: true,
    fixed: (c, r) => r >= 10 && (c <= 6 || c >= 29) }
];

/* ---------- Audio ---------- */
let audioCtx = null, soundOn = true, lastCarveSound = 0;
function initAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  if (!soundOn || !audioCtx) return;
  try {
    const t = audioCtx.currentTime + delay;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) {}
}
function soundCarve() {
  const now = performance.now();
  if (now - lastCarveSound < 70) return;
  lastCarveSound = now;
  tone('triangle', 320 + Math.random() * 80, 120, 0.08, 0.07);
}
const soundSnap = () => tone('sawtooth', 140, 35, 0.25, 0.2);
const soundWin = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone('sine', f, f, 0.35, 0.1, i * 0.1));

/* ---------- Scene ---------- */
const stage = document.getElementById('stage');
const scene = new THREE.Scene();
const BG = [0.043, 0.071, 0.098];
scene.background = new THREE.Color(0x0b1219);

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -50, 50);
camera.position.z = 20;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
stage.insertBefore(renderer.domElement, stage.firstChild);
const cv = renderer.domElement;

scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(10, 20, 25);
scene.add(sun);

function fit() {
  const w = stage.clientWidth || 1, h = stage.clientHeight || 1;
  renderer.setSize(w, h);
  const a = w / h;
  let vw = WORLD_W, vh = WORLD_H;
  if (a > vw / vh) vw = vh * a; else vh = vw / a;
  camera.left = -vw / 2; camera.right = vw / 2; camera.top = vh / 2; camera.bottom = -vh / 2;
  camera.updateProjectionMatrix();
}
new ResizeObserver(fit).observe(stage);

// Drafting grid
const grid = new THREE.GridHelper(80, 40, 0x172430, 0x121c26);
grid.rotation.x = Math.PI / 2;
grid.position.z = -5;
scene.add(grid);

// Water behind the bedrock (only shown on levels with gaps)
const water = new THREE.Mesh(
  new THREE.PlaneGeometry(WORLD_W + 20, 5),
  new THREE.MeshBasicMaterial({ color: 0x1b5f7c, transparent: true, opacity: 0.55 })
);
water.position.set(0, -HALF_H - 0.5 - 2.5, -1);
scene.add(water);
const waterLine = new THREE.Mesh(
  new THREE.PlaneGeometry(WORLD_W + 20, 0.12),
  new THREE.MeshBasicMaterial({ color: 0x5fb6d6, transparent: true, opacity: 0.8 })
);
waterLine.position.set(0, -HALF_H - 0.5, -0.9);
scene.add(waterLine);

/* ---------- Quad meshes (one square per grid node) ---------- */
function makeQuadGeo(n) {
  const pos = new Float32Array(n * 12), col = new Float32Array(n * 12), idx = new Uint16Array(n * 6);
  for (let i = 0; i < n; i++) {
    const b = i * 4;
    idx.set([b, b + 1, b + 2, b, b + 2, b + 3], i * 6);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3).setUsage(THREE.DynamicDrawUsage));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  return g;
}
function setQuad(P, i, x, y, h) {
  const o = i * 12;
  P[o] = x - h;     P[o + 1] = y - h;     P[o + 2] = 0;
  P[o + 3] = x + h; P[o + 4] = y - h;     P[o + 5] = 0;
  P[o + 6] = x + h; P[o + 7] = y + h;     P[o + 8] = 0;
  P[o + 9] = x - h; P[o + 10] = y + h;    P[o + 11] = 0;
}
function setQuadColor(C, i, r, g, b) {
  const o = i * 12;
  for (let v = 0; v < 4; v++) { C[o + v * 3] = r; C[o + v * 3 + 1] = g; C[o + v * 3 + 2] = b; }
}


let rockMesh = null;
function buildRock() {
  if (rockMesh) { scene.remove(rockMesh); rockMesh.geometry.dispose(); rockMesh = null; }
  const cells = new Map();
  const span = (c, max) => c === 0 ? [-EXT, 0] : c === max ? [max, max + EXT] : [c, c];
  for (const n of nodes) {
    if (!n.fixed) continue;
    const [x0, x1] = span(n.c, COLS - 1), [y0, y1] = span(n.r, ROWS - 1);
    for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) cells.set(cx + ',' + cy, [cx, cy]);
  }
  const list = [...cells.values()];
  const g = makeQuadGeo(list.length);
  const P = g.attributes.position.array, C = g.attributes.color.array;
  const isFreeNode = (c, r) => c >= 0 && c < COLS && r >= 0 && r < ROWS && !nodes[r * COLS + c].fixed;
  list.forEach(([c, r], i) => {
    setQuad(P, i, c * SP - HALF_W, r * SP - HALF_H, 0.5);
    const h = (((c * 73856093) ^ (r * 19349663)) >>> 0) % 100 / 100;
    const v = 0.88 + h * 0.2;
    const edge = isFreeNode(c + 1, r) || isFreeNode(c - 1, r) || isFreeNode(c, r + 1) || isFreeNode(c, r - 1);
    if (edge) setQuadColor(C, i, 0.2 * v, 0.27 * v, 0.33 * v);
    else setQuadColor(C, i, 0.115 * v, 0.165 * v, 0.21 * v);
  });
  rockMesh = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true }));
  rockMesh.frustumCulled = false;
  rockMesh.position.z = -0.2;
  scene.add(rockMesh);
}

/* ---------- Lattice lines ---------- */
const MAX_SPRINGS = COLS * ROWS * 4;
const lineGeo = new THREE.BufferGeometry();
const linePos = new Float32Array(MAX_SPRINGS * 6), lineCol = new Float32Array(MAX_SPRINGS * 6);
lineGeo.setAttribute('position', new THREE.BufferAttribute(linePos, 3).setUsage(THREE.DynamicDrawUsage));
lineGeo.setAttribute('color', new THREE.BufferAttribute(lineCol, 3).setUsage(THREE.DynamicDrawUsage));
const lines = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({ vertexColors: true }));
lines.frustumCulled = false;
lines.position.z = 0.1;
scene.add(lines);

/* ---------- Cargo ---------- */
const cargo = new THREE.Group();
cargo.position.z = 1;
scene.add(cargo);
const crate = new THREE.Mesh(new THREE.BoxGeometry(3.6, 1.4, 1.4),
  new THREE.MeshStandardMaterial({ color: 0xf2c14e, roughness: 0.4, metalness: 0.5 }));
const deck = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.25, 1.6),
  new THREE.MeshStandardMaterial({ color: 0x56697a, roughness: 0.5, metalness: 0.7 }));
cargo.add(crate, deck);
const cableGeo = new THREE.BufferGeometry();
cableGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(24), 3));
const cables = new THREE.LineSegments(cableGeo, new THREE.LineBasicMaterial({ color: 0xcbd5e1 }));
cables.frustumCulled = false;
cargo.add(cables);

/* ---------- Brush ---------- */
let brushR = 1.8;
const brush = new THREE.Group();
brush.position.z = 2;
brush.visible = false;
const disc = new THREE.Mesh(new THREE.CircleGeometry(brushR, 48),
  new THREE.MeshBasicMaterial({ color: 0xf2c14e, transparent: true, opacity: 0.18, depthWrite: false }));
const ring = new THREE.Mesh(new THREE.RingGeometry(brushR - 0.06, brushR, 48),
  new THREE.MeshBasicMaterial({ color: 0xf2c14e, transparent: true, opacity: 0.9, depthWrite: false, side: THREE.DoubleSide }));
brush.add(disc, ring);
scene.add(brush);
function setBrushRadius(r) {
  brushR = r;
  disc.geometry.dispose(); ring.geometry.dispose();
  disc.geometry = new THREE.CircleGeometry(r, 48);
  ring.geometry = new THREE.RingGeometry(Math.max(0.01, r - 0.06), r, 48);
}

/* ---------- Game state ---------- */
let cur = 0;
let nodes = [], springs = [];
let totalCarvable = 0, removedCount = 0;
let prevKE = 0, peak = 0, lastPeak = 0, stableTimer = 0, ramp = 0;
let state = 'SETTLING';       // SETTLING | STABILIZING | STABLE | PASSED | FAILED
let topoDirty = true, connected = true;
let undoStack = [], stroke = [];
let best = {};
try { best = JSON.parse(localStorage.getItem('topology-carver-best-v2') || '{}') || {}; } catch (e) { best = {}; }
function saveBest() { try { localStorage.setItem('topology-carver-best-v2', JSON.stringify(best)); } catch (e) {} }

function addSpring(n1, n2, type, k, maxComp, maxTens) {
  const sp = { n1, n2, type, k, maxComp, maxTens, rest: Math.hypot(n2.x - n1.x, n2.y - n1.y), broken: false, ratio: 0, sg: 0 };
  springs.push(sp); n1.adj.push(sp); n2.adj.push(sp);
}

function initLevel(idx) {
  cur = idx;
  const lvl = LEVELS[idx];
  state = 'SETTLING'; stableTimer = 0; removedCount = 0; peak = 0; ramp = 1;
  undoStack = []; stroke = [];
  nodes = []; springs = [];

  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const x = c * SP - HALF_W, y = r * SP - HALF_H;
    const isWeight = r === lvl.loadRow && lvl.loadCols.includes(c);
    nodes.push({
      i: r * COLS + c, c, r, x, y, ox: x, oy: y, vx: 0, vy: 0,
      mass: isWeight ? LOAD_MASS : NODE_MASS, fixed: lvl.fixed(c, r), isWeight,
      removed: false, debris: false, cx: 0, cy: 0, cvx: (Math.random() - 0.5) * 1.4, cvy: 0,
      mag: 0, sig: 0, dm: 0, ds: 0, adj: []
    });
  }
  // Material outside the playable area (trimmed from the start, not scored)
  if (lvl.void) for (const n of nodes) if (!n.fixed && !n.isWeight && lvl.void(n.c, n.r)) { n.removed = true; n.void = true; }
  totalCarvable = nodes.filter(n => !n.fixed && !n.isWeight && !n.void).length;

  const at = (c, r) => nodes[r * COLS + c];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const n = at(c, r);
    if (c + 1 < COLS) addSpring(n, at(c + 1, r), 'axial', K_AXIAL, MAX_COMPRESSION, MAX_TENSION);
    if (r + 1 < ROWS) addSpring(n, at(c, r + 1), 'axial', K_AXIAL, MAX_COMPRESSION, MAX_TENSION);
    if (c + 1 < COLS && r + 1 < ROWS) addSpring(n, at(c + 1, r + 1), 'shear', K_SHEAR, MAX_SHEAR, MAX_SHEAR);
    if (c - 1 >= 0 && r + 1 < ROWS) addSpring(n, at(c - 1, r + 1), 'shear', K_SHEAR, MAX_SHEAR, MAX_SHEAR);
  }

  buildRock();
  water.visible = waterLine.visible = !!lvl.water;
  topoDirty = true;
  settle();
  refreshMenu();
  updateHud(true);
}

// Run the solver quietly so the level starts at rest under its load.
function settle() {
  ramp = 1; stableTimer = 0; lastPeak = 0; state = 'SETTLING';
  for (let i = 0; i < 800; i++) {
    solve(true);
    if (state === 'STABLE' || state === 'PASSED' || state === 'FAILED') break;
  }
}

/* ---------- Solver (mass-spring lattice, unchanged physics) ---------- */
function checkConnected(loads) {
  const seen = new Uint8Array(nodes.length), q = [];
  for (const n of nodes) if (n.fixed && !n.removed) { seen[n.i] = 1; q.push(n); }
  for (let h = 0; h < q.length; h++) {
    const n = q[h];
    for (const sp of n.adj) {
      if (sp.broken) continue;
      const o = sp.n1 === n ? sp.n2 : sp.n1;
      if (o.removed || seen[o.i]) continue;
      seen[o.i] = 1; q.push(o);
    }
  }
  return loads.every(n => seen[n.i]);
}

function setFailed(quiet) {
  if (state !== 'FAILED' && !quiet) soundSnap();
  state = 'FAILED'; stableTimer = 0;
}

function solve(prewarm) {
  const lvl = LEVELS[cur];
  if (!prewarm) ramp = Math.min(1, ramp + (1 / 60) / 0.2);
  const k = Math.sin(ramp * Math.PI * 0.5);

  const loads = [];
  for (const c of lvl.loadCols) loads.push(nodes[lvl.loadRow * COLS + c]);

  if (topoDirty) { connected = checkConnected(loads); topoDirty = false; }
  if (!connected) { setFailed(prewarm); return; }

  const perNode = (lvl.force * k) / loads.length;
  let maxRatio = 0, snapped = false;

  for (let s = 0; s < SUBSTEPS; s++) {
    for (const n of loads) n.vy += (perNode / n.mass) * DT;
    for (const n of nodes) if (!n.fixed && !n.isWeight && !n.removed) n.vy -= GRAVITY * DT;

    for (const sp of springs) {
      if (sp.broken) continue;
      const n1 = sp.n1, n2 = sp.n2;
      if (n1.removed || n2.removed) continue;
      const dx = n2.x - n1.x, dy = n2.y - n1.y;
      const len = Math.hypot(dx, dy) || 1e-4;
      const force = sp.k * (len - sp.rest);
      let ratio;
      if (sp.type === 'shear') ratio = Math.abs(force) / MAX_SHEAR;
      else ratio = force < 0 ? -force / sp.maxComp : force / sp.maxTens;

      sp.ratio = Math.min(1, ratio);
      sp.sg = sp.type === 'shear' ? 0 : (force >= 0 ? sp.ratio : -sp.ratio);
      if (ratio > maxRatio) maxRatio = ratio;

      if (ratio >= 1) {
        sp.broken = true; snapped = true; topoDirty = true;
        if (!prewarm) soundSnap();
        continue;
      }
      const fx = (dx / len) * force, fy = (dy / len) * force;
      if (!n1.fixed) { n1.vx += (fx / n1.mass) * DT; n1.vy += (fy / n1.mass) * DT; }
      if (!n2.fixed) { n2.vx -= (fx / n2.mass) * DT; n2.vy -= (fy / n2.mass) * DT; }
    }

    for (const n of nodes) {
      if (n.removed) continue;
      if (n.fixed) { n.x = n.ox; n.y = n.oy; n.vx = n.vy = 0; continue; }
      n.x += n.vx * DT; n.y += n.vy * DT;
      n.vx *= DAMPING; n.vy *= DAMPING;
    }

    // Kinetic damping: when the kinetic energy passes its peak the lattice has crossed
    // equilibrium, so drop all velocities. This makes the structure settle much faster.
    let ke = 0;
    for (const n of nodes) if (!n.fixed && !n.removed) ke += n.mass * (n.vx * n.vx + n.vy * n.vy);
    if (ke < prevKE) { for (const n of nodes) { n.vx = 0; n.vy = 0; } prevKE = 0; } else prevKE = ke;
  }
  peak = maxRatio;

  // Per-node stress for the heatmap
  for (const n of nodes) { n.mag = 0; n.sig = 0; }
  for (const sp of springs) {
    if (sp.broken || sp.n1.removed || sp.n2.removed) continue;
    for (const n of [sp.n1, sp.n2]) {
      if (sp.ratio > n.mag) n.mag = sp.ratio;
      if (Math.abs(sp.sg) > Math.abs(n.sig)) n.sig = sp.sg;
    }
  }

  let maxDrop = 0, maxFall = 0;
  for (const n of loads) {
    maxDrop = Math.max(maxDrop, n.oy - n.y);
    maxFall = Math.min(maxFall, n.vy);
  }
  let maxV2 = 0;
  for (const n of nodes) if (!n.removed && !n.fixed) maxV2 = Math.max(maxV2, n.vx * n.vx + n.vy * n.vy);
  const settled = maxV2 < 0.01;

  if (maxDrop > MAX_DROP || maxFall < -3.5) { setFailed(prewarm); return; }

  const dPeak = Math.abs(peak - lastPeak); lastPeak = peak;
  if (snapped || !settled || dPeak > PEAK_EPS) stableTimer = 0; else stableTimer++;
  const pct = totalCarvable ? removedCount / totalCarvable * 100 : 0;
  const stable = stableTimer >= STABLE_STEPS;
  const prev = state;
  if (stable && pct >= STARS[0]) state = 'PASSED';
  else if (stable) state = 'STABLE';
  else if (stableTimer > 6) state = 'STABILIZING';
  else state = 'SETTLING';
  if (state === 'PASSED' && prev !== 'PASSED' && !prewarm) soundWin();
}

// Falling debris and collapse animation (visual only)
function animateFalling() {
  const collapsing = state === 'FAILED';
  for (const n of nodes) {
    if ((n.removed && n.debris) || (collapsing && !n.fixed && !n.removed)) {
      n.cvy -= 32 / 60;
      n.cy += n.cvy / 60;
      n.cx += n.cvx / 60;
    }
  }
}

/* ---------- Carving ---------- */
function carveAt(cx, cy) {
  let changed = false;
  const r2 = brushR * brushR;
  for (const n of nodes) {
    if (n.removed || n.fixed || n.isWeight) continue;
    const dx = n.x - cx, dy = n.y - cy;
    if (dx * dx + dy * dy <= r2) {
      n.removed = true; removedCount++; stroke.push(n.i); changed = true;
    }
  }
  return changed;
}

// Material cut off from every support (and from the weight) falls away and counts as removed.
function pruneOrphans() {
  const seen = new Uint8Array(nodes.length), q = [];
  for (const n of nodes) if (!n.removed && (n.fixed || n.isWeight)) { seen[n.i] = 1; q.push(n); }
  for (let h = 0; h < q.length; h++) {
    const n = q[h];
    for (const sp of n.adj) {
      if (sp.broken) continue;
      const o = sp.n1 === n ? sp.n2 : sp.n1;
      if (o.removed || seen[o.i]) continue;
      seen[o.i] = 1; q.push(o);
    }
  }
  for (const n of nodes) {
    if (!n.removed && !seen[n.i]) {
      n.removed = true; n.debris = true; n.cy = 0; n.cvy = 0;
      removedCount++; stroke.push(n.i);
    }
  }
}

let lastP = null;
function strokeTo(x, y) {
  let changed = false;
  if (!lastP) changed = carveAt(x, y);
  else {
    const dx = x - lastP.x, dy = y - lastP.y, d = Math.hypot(dx, dy);
    const steps = Math.max(1, Math.ceil(d / Math.max(0.25, brushR * 0.4)));
    for (let i = 1; i <= steps; i++) changed = carveAt(lastP.x + dx * i / steps, lastP.y + dy * i / steps) || changed;
  }
  lastP = { x, y };
  if (changed) {
    pruneOrphans();
    topoDirty = true; stableTimer = 0;
    if (state === 'PASSED' || state === 'STABLE') state = 'SETTLING';
    soundCarve();
  }
}

function undo() {
  if (!undoStack.length) return;
  const ids = undoStack.pop();
  for (const i of ids) {
    const n = nodes[i];
    if (n.removed) { n.removed = false; n.debris = false; removedCount--; }
  }
  for (const n of nodes) {
    n.x = n.ox; n.y = n.oy; n.vx = n.vy = 0; n.cx = n.cy = n.cvy = 0;
  }
  for (const sp of springs) { sp.broken = false; sp.ratio = 0; sp.sg = 0; }
  state = 'SETTLING'; topoDirty = true;
  settle();
  updateHud(true);
}

/* ---------- Colours ---------- */
const HEAT = [[0, .17, .37, .48], [.3, .20, .56, .56], [.55, .90, .76, .30], [.8, .94, .52, .24], [1, .91, .28, .23]];
const tmp = [0, 0, 0];
function heat(t) {
  t = Math.max(0, Math.min(1, t));
  for (let i = 1; i < HEAT.length; i++) {
    if (t <= HEAT[i][0]) {
      const a = HEAT[i - 1], b = HEAT[i], u = (t - a[0]) / (b[0] - a[0]);
      tmp[0] = a[1] + (b[1] - a[1]) * u; tmp[1] = a[2] + (b[2] - a[2]) * u; tmp[2] = a[3] + (b[3] - a[3]) * u;
      return tmp;
    }
  }
  tmp[0] = HEAT[4][1]; tmp[1] = HEAT[4][2]; tmp[2] = HEAT[4][3];
  return tmp;
}
const NEUTRAL = [0.17, 0.22, 0.27], TENS = [0.29, 0.64, 1.0], COMP = [1.0, 0.62, 0.26];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- Per-frame visuals ---------- */
function nodeAlpha(n) {
  if (!n.removed) return 1;
  return n.debris ? clamp(1 + n.cy / 9, 0, 1) : 0;
}
function updateVisuals() {
  let li = 0;
  for (const sp of springs) {
    if (sp.broken) continue;
    const a = Math.min(nodeAlpha(sp.n1), nodeAlpha(sp.n2));
    if (a < 0.03) continue;
    const o = li * 6, c = heat(Math.pow(sp.ratio, 0.8));
    linePos[o] = sp.n1.x + sp.n1.cx; linePos[o + 1] = sp.n1.y + sp.n1.cy; linePos[o + 2] = 0;
    linePos[o + 3] = sp.n2.x + sp.n2.cx; linePos[o + 4] = sp.n2.y + sp.n2.cy; linePos[o + 5] = 0;
    const r = BG[0] + (c[0] - BG[0]) * a, g = BG[1] + (c[1] - BG[1]) * a, b = BG[2] + (c[2] - BG[2]) * a;
    lineCol[o] = lineCol[o + 3] = r; lineCol[o + 1] = lineCol[o + 4] = g; lineCol[o + 2] = lineCol[o + 5] = b;
    li++;
  }
  lineGeo.attributes.position.needsUpdate = true;
  lineGeo.attributes.color.needsUpdate = true;
  lineGeo.setDrawRange(0, li * 2);

  // Cargo follows the weight nodes
  const lvl = LEVELS[cur], cp = cableGeo.attributes.position.array;
  let ax = 0, ay = 0;
  lvl.loadCols.forEach((c, i) => {
    const n = nodes[lvl.loadRow * COLS + c];
    const x = n.x + n.cx, y = n.y + n.cy;
    ax += x; ay += y;
    cp[i * 6] = x; cp[i * 6 + 1] = y; cp[i * 6 + 2] = 0;
  });
  ax /= lvl.loadCols.length; ay /= lvl.loadCols.length;
  crate.position.set(ax, ay + 1.25, 0);
  deck.position.set(ax, ay + 0.15, 0);
  lvl.loadCols.forEach((c, i) => {
    const f = (i / (lvl.loadCols.length - 1)) * 2 - 1;
    cp[i * 6 + 3] = ax + f * 1.4; cp[i * 6 + 4] = ay + 0.65; cp[i * 6 + 5] = 0;
  });
  cableGeo.attributes.position.needsUpdate = true;
}

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
const cache = {};
function setText(id, v) { if (cache[id] !== v) { cache[id] = v; $(id).textContent = v; } }
function setAttr(id, a, v) { const k = id + a; if (cache[k] !== v) { cache[k] = v; $(id).setAttribute(a, v); } }
const starsFor = pct => STARS.filter(t => pct >= t).length;

function updateHud(force) {
  if (force) for (const k in cache) delete cache[k];
  const lvl = LEVELS[cur];
  const pct = totalCarvable ? removedCount / totalCarvable * 100 : 0;
  const counted = state === 'STABLE' || state === 'PASSED';
  setText('lvlnum', String(cur + 1));
  setText('lvlname', lvl.name);
  setText('statCarved', counted ? pct.toFixed(1) : '—');
  const sv = Math.min(100, peak * 100);
  setText('statStress', sv.toFixed(2));
  $('stressMask').style.width = (100 - sv) + '%';
  setAttr('statCarved', 'data-s', state === 'FAILED' ? 'failed' : counted ? (pct >= STARS[0] ? 'passed' : 'holding') : 'settling');
  setAttr('stars', 'data-n', String(counted ? starsFor(pct) : 0));
  setAttr('undo', 'data-alert', state === 'FAILED' ? '1' : '0');
  $('undo').disabled = undoStack.length === 0;
  if (counted) {
    const r = Math.round(pct * 10) / 10;
    if (r > (best[cur] || 0)) { best[cur] = r; saveBest(); refreshMenu(); }
  }
}

function buildMenu() {
  const m = $('menu');
  m.innerHTML = '';
  LEVELS.forEach((l, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.title = l.name;
    b.innerHTML = `<span>${i + 1}</span><span class="pips"><i></i><i></i><i></i></span>`;
    b.addEventListener('click', () => { initAudio(); initLevel(i); closeMenu(); });
    m.appendChild(b);
  });
  refreshMenu();
}
function refreshMenu() {
  [...$('menu').children].forEach((b, i) => {
    b.setAttribute('aria-current', String(i === cur));
    b.dataset.n = String(starsFor(best[i] || 0));
  });
}
function closeMenu() { $('menu').hidden = true; $('lvlbtn').setAttribute('aria-expanded', 'false'); }
$('lvlbtn').addEventListener('click', e => {
  e.stopPropagation();
  const open = $('menu').hidden;
  $('menu').hidden = !open;
  $('lvlbtn').setAttribute('aria-expanded', String(open));
});
document.addEventListener('click', e => { if (!$('lvl').contains(e.target)) closeMenu(); });
$('prev').addEventListener('click', () => { initAudio(); initLevel((cur + LEVELS.length - 1) % LEVELS.length); });
$('next').addEventListener('click', () => { initAudio(); initLevel((cur + 1) % LEVELS.length); });
$('undo').addEventListener('click', () => { initAudio(); undo(); });

function setRadiusUi(v) { $('brushDot').style.width = $('brushDot').style.height = (5 + v * 5) + 'px'; }
$('radius').addEventListener('input', e => {
  const v = parseFloat(e.target.value);
  setRadiusUi(v);
  setBrushRadius(v);
});
setRadiusUi(1.8);
window.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  else if (e.key === 'Escape') closeMenu();
  else if (e.key === 'r' || e.key === 'R') initLevel(cur);
  else if (e.key === '[' || e.key === ']') {
    const r = $('radius'); r.value = clamp(parseFloat(r.value) + (e.key === ']' ? 0.2 : -0.2), 0.4, 3.8);
    r.dispatchEvent(new Event('input'));
  }
});

/* ---------- Pointer input ---------- */
let carving = false;
function toWorld(e) {
  const rect = cv.getBoundingClientRect();
  return {
    x: camera.left + ((e.clientX - rect.left) / rect.width) * (camera.right - camera.left),
    y: camera.top - ((e.clientY - rect.top) / rect.height) * (camera.top - camera.bottom)
  };
}
function onMove(e) {
  const p = toWorld(e);
  brush.position.x = p.x; brush.position.y = p.y; brush.visible = true;
  if (carving && state !== 'FAILED') strokeTo(p.x, p.y);
}
function endStroke(e) {
  if (!carving) return;
  carving = false; lastP = null;
  if (stroke.length) { undoStack.push(stroke); if (undoStack.length > 200) undoStack.shift(); }
  stroke = [];
  if (e && e.pointerType === 'touch') brush.visible = false;
}
cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  initAudio();
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  carving = true; stroke = []; lastP = null;
  onMove(e);
});
cv.addEventListener('pointermove', onMove);
cv.addEventListener('pointerup', endStroke);
cv.addEventListener('pointercancel', endStroke);
cv.addEventListener('pointerleave', () => { if (!carving) brush.visible = false; });

/* ---------- Main loop (fixed 60 Hz physics) ---------- */
let last = performance.now(), acc = 0;
function frame(t) {
  requestAnimationFrame(frame);
  acc += Math.min(0.1, (t - last) / 1000); last = t;
  let guard = 0;
  while (acc >= 1 / 60 && guard++ < 5) {
    if (state !== 'FAILED') {
      // Run the solver several times per frame until the structure has converged.
      const n = (state === 'STABLE' || state === 'PASSED') ? 1 : SOLVES_PER_FRAME;
      for (let i = 0; i < n && state !== 'FAILED'; i++) solve(false);
    }
    animateFalling();
    acc -= 1 / 60;
  }
  updateVisuals();
  updateHud(false);
  renderer.render(scene, camera);
}

fit();
buildMenu();
initLevel(0);
requestAnimationFrame(frame);

window.__topologyCarver = {
  LEVELS,
  initLevel, solve, animateFalling, carveAt, pruneOrphans, setBrushRadius,
  info: () => ({ state, peak, removed: removedCount, total: totalCarvable, connected }),
  stepN: n => { for (let i = 0; i < n; i++) { if (state !== 'FAILED') solve(false); } }
};
})();
</script>

</body></html>
