<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Structo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
  /* Layout: the board fills the screen. Level selector top left, readout top right, brush, undo and reset in a dock at the bottom.
     Look: bright sky, chunky white panels with a bottom ledge, glossy gold buttons, rounded type. */
  :root {
    --panel: #ffffff; --ledge: #a6c9dd; --line: #c3dbe8; --track: #d6e8f1;
    --fg: #17384d; --muted: #5c8099;
    --accent: #ffb21f; --accent-d: #d98400; --accent-fg: #4a2b00;
    --good: #14a96b; --bad: #ee4b3a; --bad-d: #b92f21;
    --font-display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
    --font-body: 'Fredoka', system-ui, sans-serif;
    --font-mono: 'Fredoka', system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { background: linear-gradient(#86d0f3, #e4f7ff); color: var(--fg); font-family: var(--font-body); font-size: 15px; font-weight: 500; overflow: hidden; -webkit-user-select: none; user-select: none; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  #stage { position: absolute; inset: 0; overflow: hidden; }
  #stage canvas { position: absolute; inset: 0; touch-action: none; cursor: crosshair; display: block; }

  .glass { background: var(--panel); border: 2px solid var(--line); border-radius: 18px; box-shadow: 0 4px 0 var(--ledge), 0 10px 20px rgba(23, 56, 77, 0.14); }
  .icon { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 14px; color: var(--fg); }
  .icon svg { width: 22px; height: 22px; stroke-width: 2.8; }
  .icon:hover:not(:disabled) { background: #eaf4fa; }
  .icon:active:not(:disabled) { transform: translateY(2px); }
  .icon:disabled { opacity: 0.3; cursor: not-allowed; }

  #top { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
  #top > * { pointer-events: auto; }

  #lvl { position: relative; display: flex; align-items: center; padding: 3px; min-width: 0; flex: 0 1 auto; }
  #lvl .icon { flex: none; }
  #lvlbtn { display: flex; align-items: center; gap: 9px; padding: 4px 8px; border-radius: 12px; min-width: 0; text-align: left; }
  #lvlnum { flex: none; }
  #lvlbtn:hover { background: #eaf4fa; }
  #lvlnum { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(#ffc84a, #ffa800); color: var(--accent-fg); font-weight: 700; font-size: 15px; box-shadow: 0 2px 0 var(--accent-d); }
  #lvlname { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1.05; min-width: 0; overflow-wrap: anywhere; }
  #menu { position: absolute; top: calc(100% + 10px); left: 0; display: grid; grid-template-columns: repeat(5, 56px); gap: 7px; padding: 10px; max-height: min(62vh, 420px); overflow-y: auto; }
  .chip { height: 52px; border-radius: 14px; border: 2px solid var(--line); background: #fff; box-shadow: 0 3px 0 var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-weight: 700; font-size: 16px; }
  .chip:hover { border-color: var(--muted); }
  .chip[aria-current="true"] { border-color: var(--accent); background: #fff6df; box-shadow: 0 3px 0 var(--accent-d); }
  .pips { display: flex; gap: 3px; }
  .pips i { width: 8px; height: 8px; border-radius: 50%; background: var(--track); display: block; }
  .chip[data-n="1"] .pips i:nth-child(-n+1), .chip[data-n="2"] .pips i:nth-child(-n+2), .chip[data-n="3"] .pips i { background: var(--accent); }

  #stats { display: flex; gap: 18px; padding: 8px 16px; margin-left: auto; flex: none; }
  .stat { min-width: 0; border-radius: 10px; }
  .k { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .row { display: flex; align-items: baseline; gap: 2px; }
  .v { font-weight: 700; font-size: 29px; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .row small { font-size: 13px; font-weight: 600; color: var(--muted); }
  #statBest { color: var(--muted); }
  #statCarved[data-s="settling"] { color: var(--muted); }
  #statCarved[data-s="passed"] { color: var(--good); }
  #statCarved[data-s="failed"] { color: var(--bad); }
  #zoomReset { position: absolute; right: 14px; bottom: 92px; }
  #starpop { position: absolute; left: 50%; top: 24%; transform: translateX(-50%); pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 4px; z-index: 5; }
  #starpop .row3 { display: flex; gap: 6px; }
  #starpop svg { width: 54px; height: 54px; fill: #e3eef4; stroke: #b4cbd8; stroke-width: 1.6; stroke-linejoin: round; filter: drop-shadow(0 3px 0 rgba(23,56,77,.15)); }
  #starpop svg.on { fill: var(--accent); stroke: var(--accent-d); }
  #starpop svg.new { animation: starpop .7s cubic-bezier(.2,1.6,.4,1) both; }
  #starpop b { font-family: var(--font-display); font-size: 26px; letter-spacing: .04em; text-transform: uppercase; color: var(--accent-d); text-shadow: 0 2px 0 #fff, 0 0 12px #fff; animation: starpop .5s .1s cubic-bezier(.2,1.6,.4,1) both; }
  #starpop.out { animation: starout .5s ease-in forwards; }
  @keyframes starpop { 0% { transform: scale(0) rotate(-40deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
  @keyframes starout { to { opacity: 0; transform: translateX(-50%) translateY(-24px); } }

  #dock { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 6px 8px; }
  #undo[data-alert="1"], #reset[data-armed="1"] { color: #fff; background: var(--bad); box-shadow: 0 3px 0 var(--bad-d); }
  .sep { width: 2px; height: 26px; border-radius: 1px; background: var(--line); }
  .dotwrap { width: 34px; height: 34px; display: grid; place-items: center; }
  #brushDot { display: block; border-radius: 50%; border: 3px solid var(--fg); background: rgba(23, 56, 77, 0.12); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 140px; height: 14px; border-radius: 7px; background: var(--track); margin: 0; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(#ffc84a, #ffa800); border: 3px solid #fff; box-shadow: 0 3px 0 var(--accent-d); }
  input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #ffb21f; border: 3px solid #fff; box-shadow: 0 3px 0 var(--accent-d); }
  #resetHint { position: absolute; right: 0; bottom: calc(100% + 10px); background: var(--fg); color: #fff; font-size: 13px; font-weight: 600; padding: 6px 11px; border-radius: 10px; white-space: nowrap; pointer-events: none; }

  #coach { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); width: min(450px, calc(100% - 24px)); padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 8px; }
  .coachtop { display: flex; justify-content: space-between; align-items: center; }
  #coachStep { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  #coachSkip { font-size: 13px; font-weight: 600; color: var(--muted); padding: 3px 8px; border-radius: 8px; }
  #coachSkip:hover { background: #eaf4fa; color: var(--fg); }
  #coach h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 28px; letter-spacing: 0.01em; line-height: 1.05; }
  #coach p { margin: 0; font-size: 16px; line-height: 1.4; }
  #coachProg { display: flex; align-items: center; gap: 10px; }
  #coachProg div { flex: 1; height: 12px; border-radius: 6px; background: var(--track); overflow: hidden; }
  #coachProg i { display: block; height: 100%; width: 0; background: linear-gradient(#ffc84a, #ffa800); border-radius: 6px; }
  #coachProg span { font-weight: 600; font-size: 13px; color: var(--muted); min-width: 5.5em; text-align: right; }
  .primary { background: linear-gradient(#ffc84a, #ffa800); color: var(--accent-fg); font-weight: 700; font-size: 16px; border-radius: 14px; padding: 10px 22px; align-self: flex-start; box-shadow: 0 4px 0 var(--accent-d); }
  .primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-d); }

  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 178, 31, 0.8); } 70% { box-shadow: 0 0 0 14px rgba(255, 178, 31, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 178, 31, 0); } }
  #coach.ok { border-color: var(--good); box-shadow: 0 4px 0 #0e7f50, 0 10px 20px rgba(20, 169, 107, 0.25); }
  #coach.ok h2 { color: var(--good); }
  @keyframes nudge { 0%, 100% { transform: translateX(-14px); } 50% { transform: translateX(14px); } }
  #radius.nudge { animation: nudge 1.2s ease-in-out infinite; }
  .pulse { outline: 3px solid var(--accent); outline-offset: 4px; animation: pulse 1.5s ease-out infinite; }

  @media (max-width: 560px) {
    #lvlname { display: none; }
    #stats { gap: 12px; padding: 6px 12px; }
    .v { font-size: 22px; }
    input[type=range] { width: 100px; }
    #coach h2 { font-size: 24px; }
    #coach p { font-size: 15px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } .pulse { animation: none; } }
</style>

<main id="stage">
  <div id="top">
    <div id="lvl" class="glass">
      <button type="button" class="icon" id="prev" aria-label="Previous level"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>

  <div id="dock" class="glass">

    <span class="sep"></span>
    <span class="dotwrap"><i id="brushDot"></i></span>
    <input type="range" id="radius" min="0" max="100" step="1" value="68" aria-label="Brush size">

    <button type="button" class="icon" id="reset" aria-label="Reset level" title="Reset level (R)"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v5h5M20 20v-5h-5"/><path d="M5.6 15a8 8 0 0013.3 2.6M18.4 9A8 8 0 005.1 6.4"/></svg></button>
    <span id="resetHint" hidden>Tap again to reset</span>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

(() => {

      removed: false, debris: false, void: false, cx: 0, cy: 0, cvx: (Math.random() - 0.5) * 1.4, cvy: 0,

  totalCarvable = nodes.filter(n => !n.fixed && !n.isWeight && !n.void).length;

  const at = (c, r) => nodes[r * COLS + c];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const n = at(c, r);
    if (c + 1 < COLS) addSpring(n, at(c + 1, r), 'axial', K_AXIAL, MAX_COMPRESSION, MAX_TENSION);
    if (r + 1 < ROWS) addSpring(n, at(c, r + 1), 'axial', K_AXIAL, MAX_COMPRESSION, MAX_TENSION);
    if (c + 1 < COLS && r + 1 < ROWS) addSpring(n, at(c + 1, r + 1), 'shear', K_SHEAR, MAX_SHEAR, MAX_SHEAR);

    if (typeof saved.c === 'string') springs.forEach((sp, i) => { if (saved.c[i] === '1' && cuttable(sp)) sp.broken = sp.cut = true; });

// Run the solver quietly until the level is at rest. Ramping the load keeps a restored layout from overshooting.

/* ---------- Solver (mass-spring lattice) ---------- */

  for (let h = 0; h < q.length; h++) {
    const n = q[h];
    for (const sp of n.adj) {
      if (sp.broken) continue;
      const o = sp.n1 === n ? sp.n2 : sp.n1;
      if (o.removed || seen[o.i]) continue;
      seen[o.i] = 1; q.push(o);
    }
  }
  return loads.every(n => seen[n.i]);
}

function setFailed(quiet) {

  state = 'FAILED'; stableTimer = 0;
}

function solve(prewarm) {
  const lvl = LEVELS[cur];

  const k = Math.sin(ramp * Math.PI * 0.5);

  const loads = [], perOf = new Map();

    for (const n of loads) n.vy += (perOf.get(n) * k / n.mass) * DT;
    for (const n of nodes) if (!n.fixed && !n.isWeight && !n.removed) n.vy -= GRAVITY * DT;

    for (const sp of springs) {
      if (sp.broken) continue;
      const n1 = sp.n1, n2 = sp.n2;
      if (n1.removed || n2.removed) continue;
      const dx = n2.x - n1.x, dy = n2.y - n1.y;
      const len = Math.hypot(dx, dy) || 1e-4;
      const force = sp.k * (len - sp.rest);
      let ratio;
      if (sp.type === 'shear') ratio = Math.abs(force) / MAX_SHEAR;
      else ratio = force < 0 ? -force / sp.maxComp : force / sp.maxTens;

      sp.ratio = Math.min(1, ratio);
      sp.sg = sp.type === 'shear' ? 0 : (force >= 0 ? sp.ratio : -sp.ratio);
      if (ratio > maxRatio) maxRatio = ratio;

      if (ratio >= 1) {
        sp.broken = true; snapped = true; topoDirty = true;
        if (!prewarm) { soundSnap(); snapFx(sp); }
        continue;
      }
      const fx = (dx / len) * force, fy = (dy / len) * force;
      if (!n1.fixed) { n1.vx += (fx / n1.mass) * DT; n1.vy += (fy / n1.mass) * DT; }
      if (!n2.fixed) { n2.vx -= (fx / n2.mass) * DT; n2.vy -= (fy / n2.mass) * DT; }
    }

    for (const n of nodes) {
      if (n.removed) continue;
      if (n.fixed) { n.x = n.ox; n.y = n.oy; n.vx = n.vy = 0; continue; }
      n.x += n.vx * DT; n.y += n.vy * DT;

    // Kinetic damping: when the kinetic energy passes its peak the lattice has crossed
    // equilibrium, so drop all velocities. This makes the structure settle much faster.
    let ke = 0;
    for (const n of nodes) if (!n.fixed && !n.removed) ke += n.mass * (n.vx * n.vx + n.vy * n.vy);
    if (ke < prevKE) { for (const n of nodes) { n.vx = 0; n.vy = 0; } prevKE = 0; } else prevKE = ke;
  }

  // Per-node stress for the soft fill
  for (const n of nodes) { n.mag = 0; n.sig = 0; }
  for (const sp of springs) {
    if (sp.broken || sp.n1.removed || sp.n2.removed) continue;
    for (const n of [sp.n1, sp.n2]) {
      if (sp.ratio > n.mag) n.mag = sp.ratio;
      if (Math.abs(sp.sg) > Math.abs(n.sig)) n.sig = sp.sg;
    }
  }

  let maxDrop = 0, maxFall = 0;
  for (const n of loads) { maxDrop = Math.max(maxDrop, n.oy - n.y); maxFall = Math.min(maxFall, n.vy); }
  let maxV2 = 0;
  for (const n of nodes) if (!n.removed && !n.fixed) maxV2 = Math.max(maxV2, n.vx * n.vx + n.vy * n.vy);
  const settled = maxV2 < 0.01;

  if (maxDrop > MAX_DROP || maxFall < -3.5) { setFailed(prewarm); return; }

  const dPeak = Math.abs(peak - lastPeak); lastPeak = peak;
  if (snapped || !settled || dPeak > PEAK_EPS) stableTimer = 0; else stableTimer++;
  const pct = stickPct();
  const stable = stableTimer >= STABLE_STEPS;
  const prev = state;
  if (stable && pct >= STARS[0]) state = 'PASSED';
  else if (stable) state = 'STABLE';
  else if (stableTimer > 6) state = 'STABILIZING';
  else state = 'SETTLING';
  if (state === 'PASSED' && prev !== 'PASSED' && !prewarm) soundWin();
}

// Falling debris and collapse animation (visual only)
function animateFalling() {
  const collapsing = state === 'FAILED';
  for (const n of nodes) {
    if ((n.removed && n.debris) || (collapsing && !n.fixed && !n.removed)) {
      n.cvy -= 32 / 60; n.cy += n.cvy / 60; n.cx += n.cvx / 60;

}

/* ---------- Carving ---------- */

    const t = clamp(((cx - a.x) * ex + (cy - a.y) * ey) / l2, 0, 1);

// Material cut off from every support (and from the weight) falls away and counts as removed.
function pruneOrphans() {

  for (const n of nodes) if (!n.removed && (n.fixed || n.isWeight)) { seen[n.i] = 1; q.push(n); }
  for (let h = 0; h < q.length; h++) {
    const n = q[h];
    for (const sp of n.adj) {
      if (sp.broken) continue;
      const o = sp.n1 === n ? sp.n2 : sp.n1;
      if (o.removed || seen[o.i]) continue;
      seen[o.i] = 1; q.push(o);

function strokeTo(x, y) {

  else {
    const dx = x - lastP.x, dy = y - lastP.y, d = Math.hypot(dx, dy);
    const steps = Math.max(1, Math.ceil(d / Math.max(0.25, brushR * 0.4)));
    for (let i = 1; i <= steps; i++) changed = carveAt(lastP.x + dx * i / steps, lastP.y + dy * i / steps) || changed;
  }

      strokeEntry = { ids: stroke, snap: strokeSnap };
      undoStack.push(strokeEntry);

    }
    pruneOrphans();

function takeSnapshot() {
  const pos = new Float32Array(nodes.length * 2), br = new Uint8Array(springs.length);
  for (let i = 0; i < nodes.length; i++) { pos[i * 2] = nodes[i].x; pos[i * 2 + 1] = nodes[i].y; }
  for (let i = 0; i < springs.length; i++) br[i] = springs[i].broken ? (springs[i].cut ? 2 : 1) : 0;

}
function captureGood() {

  g.removedCount = removedCount + cutCount();

}
// Fallback when a collapse happens with no stroke to undo: go back to the last settled layout.
function restoreGood() {

  nodes.forEach((n, i) => {
    n.removed = g.removed[i] === 1; n.debris = g.debris[i] === 1;
    n.x = g.pos[i * 2]; n.y = g.pos[i * 2 + 1]; n.vx = n.vy = 0;
    if (!n.removed) { n.cx = n.cy = n.cvy = 0; } else if (n.debris) n.cy = -30;
  });
  springs.forEach((sp, i) => { sp.broken = g.br[i] > 0; sp.cut = g.br[i] === 2; sp.ratio = 0; sp.sg = 0; });

function undo() {

    n.x = snap.pos[i * 2]; n.y = snap.pos[i * 2 + 1];
    n.vx = n.vy = 0;
    if (!n.removed) { n.cx = n.cy = n.cvy = 0; }
  }

/* ---------- Colours ---------- */
const HEAT = [[0, .18, .50, .88], [.3, .10, .76, .54], [.55, 1, .80, .16], [.8, 1, .50, .12], [1, .93, .20, .20]];
const tmp = [0, 0, 0];
function heat(t) {
  t = clamp(t, 0, 1);
  for (let i = 1; i < HEAT.length; i++) {
    if (t <= HEAT[i][0]) {
      const a = HEAT[i - 1], b = HEAT[i], u = (t - a[0]) / (b[0] - a[0]);
      tmp[0] = a[1] + (b[1] - a[1]) * u; tmp[1] = a[2] + (b[2] - a[2]) * u; tmp[2] = a[3] + (b[3] - a[3]) * u;
      return tmp;
    }
  }
  tmp[0] = HEAT[4][1]; tmp[1] = HEAT[4][2]; tmp[2] = HEAT[4][3];
  return tmp;
}
function nodeAlpha(n) {
  if (!n.removed) return 1;
  return n.debris ? clamp(1 + n.cy / 9, 0, 1) : 0;
}

/* ---------- Per-frame visuals ---------- */
function updateVisuals() {
  // Soft fill
  const P = cellGeo.attributes.position.array, C = cellGeo.attributes.color.array;
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i], a = nodeAlpha(n);
    if (n.fixed || a < 0.03) { const o = i * 12; for (let k = 0; k < 12; k++) P[o + k] = 0; continue; }
    n.dm += (n.mag - n.dm) * 0.3;
    setQuad(P, i, n.x + n.cx, n.y + n.cy, 0.5);
    let r, g, b, f;
    if (n.isWeight) { r = 0.93; g = 0.66; b = 0.2; f = 0.85; }
    else { r = g = b = 0; f = 0; }  // no soft halo: only crisp sticks
    f *= a;
    setQuadColor(C, i, BG[0] + (r - BG[0]) * f, BG[1] + (g - BG[1]) * f, BG[2] + (b - BG[2]) * f);
  }
  cellGeo.attributes.position.needsUpdate = true;
  cellGeo.attributes.color.needsUpdate = true;

  // Struts: thin diagonals first, then the main links on top
  const SP_ = strutGeo.attributes.position.array, SC = strutGeo.attributes.color.array;
  let q = 0;
  for (let pass = 0; pass < 2; pass++) {
    const shear = pass === 0, hw = shear ? 0.07 : 0.2;
    for (const sp of springs) {
      if (sp.broken || (sp.type === 'shear') !== shear) continue;
      const n1 = sp.n1, n2 = sp.n2;
      if (n1.fixed && n2.fixed) continue;               // nothing to see inside the concrete
      const a = Math.min(nodeAlpha(n1), nodeAlpha(n2));
      if (a < 0.03) continue;
      const x1 = n1.x + n1.cx, y1 = n1.y + n1.cy, x2 = n2.x + n2.cx, y2 = n2.y + n2.cy;
      const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
      const px = -dy / len * hw, py = dx / len * hw, o = q * 12;
      SP_[o] = x1 + px; SP_[o + 1] = y1 + py; SP_[o + 2] = 0;
      SP_[o + 3] = x1 - px; SP_[o + 4] = y1 - py; SP_[o + 5] = 0;
      SP_[o + 6] = x2 - px; SP_[o + 7] = y2 - py; SP_[o + 8] = 0;
      SP_[o + 9] = x2 + px; SP_[o + 10] = y2 + py; SP_[o + 11] = 0;
      const c = heat(Math.pow(sp.ratio, 0.8));
      const sc = shear ? 0.55 : 1;                        // diagonals a touch lighter
      setQuadColor(SC, q, BG[0] + (c[0] - BG[0]) * a * sc, BG[1] + (c[1] - BG[1]) * a * sc, BG[2] + (c[2] - BG[2]) * a * sc);
      q++;
    }
  }
  strutGeo.attributes.position.needsUpdate = true;
  strutGeo.attributes.color.needsUpdate = true;
  strutGeo.setDrawRange(0, q * 6);

  // Cargo follows the weight nodes (one container per load group)
  const lvl = LEVELS[cur], cp = cableGeo.attributes.position.array;
  lvl.loads.forEach((L, j) => {
    let ax = 0, ay = 0;
    L.cols.forEach((c, i) => {
      const n = nodes[L.row * COLS + c];
      const x = n.x + n.cx, y = n.y + n.cy;
      ax += x; ay += y;
      const o = (j * 4 + i) * 6;
      cp[o] = x; cp[o + 1] = y; cp[o + 2] = 0;
    });
    ax /= L.cols.length; ay /= L.cols.length;
    const sc = 0.78 + 0.22 * (L.f || 1);
    boxes[j].visible = true; boxes[j].scale.setScalar(sc);
    boxes[j].position.set(ax, ay + 0.45, 0);
    L.cols.forEach((c, i) => {
      const f = (i / (L.cols.length - 1)) * 2 - 1, o = (j * 4 + i) * 6;
      cp[o + 3] = ax + f * 1.4 * sc; cp[o + 4] = ay + 0.7 * sc; cp[o + 5] = 0;
    });
  });
  for (let j = lvl.loads.length; j < boxes.length; j++) boxes[j].visible = false;
  cableGeo.setDrawRange(0, lvl.loads.length * 8);
  cableGeo.attributes.position.needsUpdate = true;
}

  $('coachText').textContent = ok ? st.ok[1] : failed ? 'Too much. Tap Undo.' : st.text;

  $('coachNext').textContent = st.button || '';

  const target = ok ? null : failed ? 'undo' : st.pulse;

  setGhost(ok || failed ? null : (st.ghost ? GHOSTS[st.ghost] : null));

}
function pathBand(path, d) {

}

  if (k === 'carve') {

  }

  }

/* ---------- UI ---------- */
let starsSeen = -1, popTimer = 0;
const STAR_PATH = 'M12 2.5l3 6.2 6.8.9-5 4.8 1.3 6.7-6.1-3.3-6.1 3.3 1.3-6.7-5-4.8 6.8-.9z';
function popStars(n) {

  el.className = '';
  el.innerHTML = '<div class="row3">' + [1, 2, 3].map(i => `<svg viewBox="0 0 24 24" class="${i <= n ? 'on' : ''}${i === n ? ' new' : ''}"><path d="${STAR_PATH}"/></svg>`).join('') + '</div><b>' + n + (n === 1 ? ' star' : ' stars') + '!</b>';
  el.hidden = false;
  clearTimeout(popTimer);
  popTimer = setTimeout(() => { el.classList.add('out'); popTimer = setTimeout(() => { el.hidden = true; }, 500); }, 1700);

}
const cache = {};
function setText(id, v) { if (cache[id] !== v) { cache[id] = v; $(id).textContent = v; } }
function setAttr(id, a, v) { const k = id + a; if (cache[k] !== v) { cache[k] = v; $(id).setAttribute(a, v); } }

function updateHud(force) {
  if (force) for (const k in cache) delete cache[k];
  const lvl = LEVELS[cur];
  const pct = stickPct();
  const counted = state === 'STABLE' || state === 'PASSED';
  setText('lvlnum', lvl.tut ? 'T' : String(cur));
  setText('lvlname', lvl.name);
  setText('statCarved', counted ? pct.toFixed(2) : '—');
  const sv = Math.min(100, peak * 100);
  setText('statStress', sv.toFixed(2));
  const hc = heat(Math.pow(sv / 100, 0.8)).map(v => Math.round(v * 200));
  const col = `rgb(${hc[0]},${hc[1]},${hc[2]})`;
  if (cache.stCol !== col) { cache.stCol = col; $('statStress').style.color = col; }
  setAttr('statCarved', 'data-s', state === 'FAILED' ? 'failed' : counted ? (pct >= STARS[0] ? 'passed' : 'holding') : 'settling');
  setAttr('undo', 'data-alert', state === 'FAILED' ? '1' : '0');
  $('undo').disabled = undoStack.length === 0 && state !== 'FAILED';

  if (counted) {
    if (!lastGood || lastGood.removedCount !== removedCount + cutCount()) {
      captureGood();
      if (!lvl.tut) persistLayout();
    }

    if (r > bestOf(cur)) { progress.best[lvl.id] = r; saveProgress(); refreshMenu(); }
  }

  setText('statBest', b ? b.toFixed(2) : '');
  $('stBest').hidden = !b;
  if (counted) {
    const n = starsFor(pct);
    if (starsSeen >= 0 && n > starsSeen) popStars(n);
    starsSeen = n;
  }

}

function buildMenu() {
  const m = $('menu');
  m.innerHTML = '';
  LEVELS.forEach((l, i) => {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'chip';
    btn.innerHTML = `<span>${l.tut ? 'T' : i}</span><span class="pips"><i></i><i></i><i></i></span>`;
    btn.addEventListener('click', () => { initAudio(); closeMenu(); if (i !== cur) initLevel(i); });
    m.appendChild(btn);

}
function refreshMenu() {

    btn.setAttribute('aria-current', String(i === cur));
    btn.dataset.n = String(starsFor(bestOf(i)));

  });
}
function closeMenu() { $('menu').hidden = true; $('lvlbtn').setAttribute('aria-expanded', 'false'); }
$('lvlbtn').addEventListener('click', e => {
  e.stopPropagation();
  const open = $('menu').hidden;
  $('menu').hidden = !open;
  $('lvlbtn').setAttribute('aria-expanded', String(open));
});
document.addEventListener('click', e => { if (!$('lvl').contains(e.target)) closeMenu(); });
$('prev').addEventListener('click', () => { initAudio(); initLevel((cur + LEVELS.length - 1) % LEVELS.length); });
$('next').addEventListener('click', () => { initAudio(); initLevel((cur + 1) % LEVELS.length); });
$('undo').addEventListener('click', () => { initAudio(); undo(); });

// Reset asks for a second tap when there is carved work to lose
let resetArmed = false, resetTimer = 0;
function disarmReset() { resetArmed = false; clearTimeout(resetTimer); $('reset').dataset.armed = '0'; $('resetHint').hidden = true; }
function resetLevel() {
  if ((removedCount > 0 || cutCount() > 0) && state !== 'FAILED' && !resetArmed) {
    resetArmed = true; $('reset').dataset.armed = '1'; $('resetHint').hidden = false;
    clearTimeout(resetTimer); resetTimer = setTimeout(disarmReset, 2500);
    return;
  }
  disarmReset();
  initLevel(cur, true);
}
$('reset').addEventListener('click', () => { initAudio(); resetLevel(); });

$('coachNext').addEventListener('click', () => { if (tutStep === TUT.length - 1) tutFinish(true); else tutDone(); });
$('coachSkip').addEventListener('click', () => tutFinish(true));

const radiusFrom = v => 0.08 + 3.72 * (v / 100) * (v / 100);   // fine control at the small end
function setRadiusUi(v) { $('brushDot').style.width = $('brushDot').style.height = (5 + v * 5) + 'px'; }
$('radius').addEventListener('input', e => {
  const v = radiusFrom(parseFloat(e.target.value));
  setRadiusUi(v);
  setBrushRadius(v);
});
setRadiusUi(1.8);
window.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  else if (e.key === 'Escape') closeMenu();
  else if (e.key === 'r' || e.key === 'R') resetLevel();
  else if (e.key === '[' || e.key === ']') {
    const r = $('radius'); r.value = clamp(parseFloat(r.value) + (e.key === ']' ? 4 : -4), 0, 100);
    r.dispatchEvent(new Event('input'));
  }
});

/* ---------- Pointer input ---------- */
function toWorld(e) {
  const rect = cv.getBoundingClientRect();
  return {
    x: camera.left + ((e.clientX - rect.left) / rect.width) * (camera.right - camera.left),
    y: camera.top - ((e.clientY - rect.top) / rect.height) * (camera.top - camera.bottom)
  };
}
function onMove(e) {
  const p = toWorld(e);
  brush.position.x = p.x; brush.position.y = p.y; brush.visible = true;
  if (carving && state !== 'FAILED') strokeTo(p.x, p.y);
}
function endStroke(e) {
  if (!carving) return;
  carving = false; lastP = null; strokeEntry = null;
  stroke = [];
  if (e && e.pointerType === 'touch') brush.visible = false;
}
const ptrs = new Map();

}, { passive: false });

/* ---------- Main loop (fixed 60 Hz physics) ---------- */

{

}

window.__topologyCarver = { popStars, snapFx,
  w2s: (x, y) => { const r = cv.getBoundingClientRect(); return [r.left + (x - camera.left) / (camera.right - camera.left) * r.width, r.top + (camera.top - y) / (camera.top - camera.bottom) * r.height]; }, LEVELS, initLevel, solve, carveAt, pruneOrphans, setBrushRadius, progress: () => progress, tut: () => tutStep,
