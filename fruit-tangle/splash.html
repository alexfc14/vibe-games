<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pet Tangle</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#F5FEF5;color:#1F2124;-webkit-tap-highlight-color:transparent}
  main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center}
  h1{margin:0;font:800 30px Georgia,"Times New Roman",serif;color:#007940}
  h1 span{font-weight:400;color:#1F2124}
  p{margin:0;font-size:14px;color:#404347}
  #board{position:relative;width:222px;height:222px;padding:6px;border:1.5px solid #00BD7059;border-radius:16px;background:#fff}
  #clip{position:relative;width:210px;height:210px;overflow:hidden;border-radius:10px}
  .strip{position:absolute;top:0;width:62px;height:210px;border-radius:10px;transition:background .4s,box-shadow .4s}
  .strip.ok{box-shadow:inset 0 0 0 2px #00BD70bf}
  .tile{position:absolute;left:0;top:0;width:70px;height:70px;text-align:center;font-size:44px;line-height:70px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;will-change:transform}
  .tile.hop{animation:hop .5s ease-out}
  @keyframes hop{40%{scale:1.25}100%{scale:1}}
  small{font-size:10px;color:#404347;opacity:.6}
  button{height:48px;padding:0 40px;border:0;border-radius:99px;background:#007940;color:#fff;font:700 15px system-ui,sans-serif;letter-spacing:.05em;cursor:pointer}
  button:active{transform:scale(.96)}
</style>
</head>
<body>
<main>
  <h1>🐾 Pet <span>Tangle</span></h1>
  <div id="board"><div id="clip"></div></div>
  <p>Slide rows and columns until each column holds just one kind of pet.</p>
  <button id="play">Play</button>
  <small>v0.7.0</small>
</main>
<script type="module" src="./splash.js"></script>
</body>
</html>
